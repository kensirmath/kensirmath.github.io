<!doctype html>
<html lang="zh-Hant" data-theme="light" data-layout="right">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>圍棋棋盤</title>

    <style>
        :root {
            --bg: #f5f3ed;
            --panel: #fffdf8;
            --soft: #f1ede3;
            --text: #26231c;
            --muted: #69655d;
            --border: #d8d0c1;
            --primary: #08777b;
            --danger: #b33a30;
            --wood1: #dfbb7b;
            --wood2: #c99d5a;
            --line: #65491f;
            --shadow: 0 8px 22px #342a1820;
        }

        [data-theme="dark"] {
            --bg: #f5f3ed;
            --panel: #fffdf8;
            --soft: #f1ede3;
            --text: #26231c;
            --muted: #69655d;
            --border: #d8d0c1;
            --primary: #08777b;
            --danger: #b33a30;
            --wood1: #fff;
            --wood2: #f5f5f5;
            --line: #65491f;
            --shadow: 0 8px 22px #342a1820;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font: 14px system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
        }

        body {
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 350px;
            height: 100vh;
            overflow: hidden;
        }

        .stage {
            display: grid;
            place-items: center;
            padding: 12px;
            min-width: 0;
            height: 100vh;
            overflow: hidden;
        }

        .board-wrap {
            position: relative;
            width: min(94vmin, 960px);
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--wood1), var(--wood2));
            box-shadow: var(--shadow);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }

        .status {
            position: absolute;
            left: 8px;
            bottom: 8px;
            z-index: 3;
            background: #111c;
            color: #fff;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            pointer-events: none;
        }

        .panel {
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 10px;
            overflow-y: auto;
            overflow-x: hidden;
            height: 100vh;
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            align-items: flex-start;
        }

        .top h1 {
            font-size: 19px;
            margin: 0;
        }

        .section {
            border-top: 1px solid var(--border);
            padding-top: 9px;
            margin-top: 9px;
        }

        .section h2 {
            font-size: 14px;
            margin: 0 0 6px;
        }

        .row,
        .tools {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .btn,
        input {
            font: inherit;
        }

        .btn {
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            padding: 4px 7px;
            min-height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover {
            filter: brightness(.96);
        }

        .btn:focus-visible,
        input:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent);
            outline-offset: 2px;
        }

        .btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn.danger {
            color: var(--danger);
        }

        .btn.active {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        input {
            width: 100%;
            min-height: 30px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            padding: 0 7px;
            font-size: 13px;
        }

        .key {
            display: inline-block;
            margin-left: 3px;
            padding: 0 3px;
            border: 1px solid currentColor;
            border-radius: 3px;
            font-size: 10px;
            line-height: 14px;
            opacity: .72;
            vertical-align: 1px;
        }

        .stat {
            background: var(--soft);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 7px;
        }

        .stat strong {
            display: block;
            font-size: 17px;
            margin-top: 0;
        }

        .moves {
            display: grid;
            gap: 4px;
            margin: 3px 0;
        }

        .move-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto auto;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--border);
            background: var(--soft);
            border-radius: 6px;
        }

        .move-row.current {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .move-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-size: 12px;
            border: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
            padding: 3px;
        }

        .move-row.current .move-name {
            color: var(--primary);
            font-weight: 800;
        }

        .move-action {
            min-width: 25px;
            min-height: 25px;
            padding: 1px 5px;
        }

        .bottom-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .status-text {
            color: var(--muted);
            font-size: 12px;
        }

        .toast {
            position: fixed;
            z-index: 30;
            left: 50%;
            bottom: 18px;
            transform: translate(-50%, 120px);
            background: #1e2421;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            transition: .22s;
            max-width: min(92vw, 500px);
            font-size: 13px;
        }

        .toast.show {
            transform: translate(-50%, 0);
        }

        dialog {
            border: 0;
            border-radius: 12px;
            background: var(--panel);
            color: var(--text);
            box-shadow: var(--shadow);
            max-width: 400px;
            width: calc(100% - 32px);
            padding: 16px;
        }

        dialog::backdrop {
            background: #0008;
        }

        dialog h3 {
            margin-top: 0;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 14px;
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            clip: rect(0, 0, 0, 0);
            overflow: hidden;
            white-space: nowrap;
        }

        /* 面板位置 */
        [data-layout="left"] .app {
            grid-template-columns: 350px minmax(0, 1fr);
        }

        [data-layout="left"] .panel {
            grid-column: 1;
            grid-row: 1;
            border-left: 0;
            border-right: 1px solid var(--border);
        }

        [data-layout="left"] .stage {
            grid-column: 2;
            grid-row: 1;
        }

        [data-layout="right"] .panel {
            grid-column: 2;
            grid-row: 1;
        }

        [data-layout="right"] .stage {
            grid-column: 1;
            grid-row: 1;
        }

        [data-layout="top"] .app {
            grid-template-columns: 1fr;
            grid-template-rows: minmax(0, 35vh) minmax(0, 65vh);
        }

        [data-layout="top"] .panel {
            grid-column: 1;
            grid-row: 1;
            height: 35vh;
            border-left: 0;
            border-bottom: 1px solid var(--border);
        }

        [data-layout="top"] .stage {
            grid-column: 1;
            grid-row: 2;
            height: 65vh;
            padding: 8px;
        }

        [data-layout="top"] .board-wrap,
        [data-layout="bottom"] .board-wrap {
            width: min(60vmin, 650px);
        }

        [data-layout="bottom"] .app {
            grid-template-columns: 1fr;
            grid-template-rows: minmax(0, 65vh) minmax(0, 35vh);
        }

        [data-layout="bottom"] .stage {
            grid-column: 1;
            grid-row: 1;
            height: 65vh;
            padding: 8px;
        }

        [data-layout="bottom"] .panel {
            grid-column: 1;
            grid-row: 2;
            height: 35vh;
            border-left: 0;
            border-top: 1px solid var(--border);
        }

        /* 紅色游標 */
        .board-wrap::after {
            content: "";
            position: absolute;
            width: 17px;
            height: 17px;
            border: 2px solid #e53935;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            left: var(--cursor-x, -100px);
            top: var(--cursor-y, -100px);
            z-index: 2;
            box-shadow: 0 0 0 1px #fff8;
        }

        .board-wrap.cursor-hidden::after {
            display: none;
        }

        /* 上下左右位置鈕縮小至字體高度 */
        #layoutButtons {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        #layoutButtons .btn {
            min-height: 18px;
            padding: 0 4px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 16px;
        }

        @media(max-width:900px) {
            body {
                overflow: auto;
            }

            [data-layout] .app {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                height: auto;
                overflow: visible;
            }

            [data-layout] .stage {
                grid-column: 1;
                grid-row: auto;
                height: auto;
                min-height: 100vh;
                padding: 10px;
                overflow: visible;
            }

            [data-layout] .panel {
                grid-column: 1;
                grid-row: auto;
                height: auto;
                max-height: none;
                overflow: visible;
                border-left: 0;
                border-right: 0;
                border-top: 1px solid var(--border);
                border-bottom: 0;
            }

            [data-layout] .board-wrap {
                width: min(96vw, 760px);
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <section class="stage">
            <div class="board-wrap cursor-hidden">
                <canvas id="board" width="1000" height="1000" aria-label="圍棋棋盤"></canvas>
                <div class="status" id="status" aria-live="polite"></div>
            </div>
        </section>

        <aside class="panel">
            <div class="top">
                <h1>圍棋棋盤</h1>
            </div>

            <section class="section">
                <h2>工具</h2>

                <div class="tools">
                    <button class="btn active" type="button" data-tool="play">落子 <span class="key">P</span></button>
                    <button class="btn" type="button" data-tool="setup">擺盤 <span class="key">S</span></button>
                    <button class="btn" type="button" data-tool="label">標字 <span class="key">L</span></button>
                    <button class="btn" type="button" data-tool="erase">擦除 <span class="key">E</span></button>
                </div>

                <div class="row" style="margin-top:5px">
                    <button class="btn active" type="button" data-color="black">黑 <span class="key">B</span></button>
                    <button class="btn" type="button" data-color="white">白 <span class="key">W</span></button>
                    <input id="labelText" maxlength="8" placeholder="標記">
                </div>

                <div class="tools" style="margin-top:5px">
                    <button class="btn primary" id="pass" type="button">虛手 <span class="key">Space</span></button>
                    <button class="btn" id="undo" type="button">復原 <span class="key">Ctrl Z</span></button>
                    <button class="btn" id="redo" type="button">重做 <span class="key">Ctrl Y</span></button>
                    <button class="btn danger" id="clear" type="button">清盤 <span class="key">R</span></button>
                </div>
            </section>

            <section class="section">
                <h2>檔案</h2>

                <div class="tools">
                    <button class="btn" id="png" type="button">PNG <span class="key">G</span></button>
                    <button class="btn" id="jsonSave" type="button">JSON↓ <span class="key">J</span></button>
                    <button class="btn" id="jsonLoad" type="button">JSON↑ <span class="key">O</span></button>
                    <input class="sr" type="file" id="file" accept="application/json,.json">
                </div>

                <div class="tools" id="layoutButtons" style="margin-top:5px">
                    <button class="btn active" type="button" data-layout="right">右 <span class="key">2</span></button>
                    <button class="btn" type="button" data-layout="left">左 <span class="key">1</span></button>
                    <button class="btn" type="button" data-layout="top">上 <span class="key">3</span></button>
                    <button class="btn" type="button" data-layout="bottom">下 <span class="key">4</span></button>
                </div>
            </section>

            <section class="section">
                <h2>手順</h2>
                <div class="moves" id="moves"></div>
            </section>

            <section class="section">
                <h2>統計</h2>

                <div class="grid3">
                    <div class="stat">
                        <span class="status-text">提子</span>
                        <strong id="caps">0 : 0</strong>
                    </div>

                    <div class="stat">
                        <span class="status-text">地</span>
                        <strong id="territory">0 : 0</strong>
                    </div>

                    <div class="stat">
                        <span class="status-text">目</span>
                        <strong id="score">0 : 0</strong>
                    </div>
                </div>
            </section>

            <section class="section">
                <h2>路數</h2>

                <div class="tools">
                    <button class="btn" type="button" data-size="9">9 <span class="key">9</span></button>
                    <button class="btn" type="button" data-size="13">13</button>
                    <button class="btn active" type="button" data-size="19">19</button>
                </div>
            </section>

            <section class="section">
                <div class="bottom-status">
                    <span class="status-text" id="autosaveStatus">草稿</span>
                    <button class="btn" id="themeBtn" type="button">暗 <span class="key">T</span></button>
                </div>
            </section>
        </aside>
    </main>

    <dialog id="confirm">
        <h3>清盤？</h3>
        <div class="dialog-actions">
            <button class="btn" id="cancelClear" type="button">取消 <span class="key">Esc</span></button>
            <button class="btn danger" id="confirmClear" type="button">清盤 <span class="key">Enter</span></button>
        </div>
    </dialog>

    <div class="toast" id="toast" role="status"></div>

    <script>
        "use strict";

        const $ = selector => document.querySelector(selector);
        const canvas = $("#board");
        const ctx = canvas.getContext("2d");
        const boardWrap = canvas.closest(".board-wrap");

        const DRAFT_KEY = "go-board-draft-v12";
        const LAYOUT_KEY = "go-board-layout-v6";
        const THEME_KEY = "go-board-theme-v6";

        const state = {
            size: 19,
            board: [],
            current: "black",
            tool: "play",
            moves: [],
            labels: [],
            captures: { black: 0, white: 0 },
            history: [],
            future: [],
            selectedStep: null,
            hover: null,
            margin: 110,
            cell: 0
        };

        const clone = value => JSON.parse(JSON.stringify(value));
        const emptyBoard = size => Array.from({ length: size }, () => Array(size).fill(null));
        const opposite = color => color === "black" ? "white" : "black";
        const pointKey = (x, y) => `${x},${y}`;

        function snapshot() {
            return clone({
                size: state.size,
                board: state.board,
                current: state.current,
                tool: state.tool,
                moves: state.moves,
                labels: state.labels,
                captures: state.captures,
                selectedStep: state.selectedStep
            });
        }

        function validState(data) {
            if (!data || ![9, 13, 19].includes(Number(data.size))) return false;
            if (!Array.isArray(data.board) || data.board.length !== Number(data.size)) return false;

            if (!data.board.every(row =>
                Array.isArray(row) &&
                row.length === Number(data.size) &&
                row.every(cell => cell === null || cell === "black" || cell === "white")
            )) {
                return false;
            }

            if (!["black", "white"].includes(data.current)) return false;
            if (!Array.isArray(data.moves)) return false;
            if (data.labels !== undefined && !Array.isArray(data.labels)) return false;
            if (!data.captures || typeof data.captures !== "object") return false;

            return true;
        }

        function applyState(data, { record = false } = {}) {
            if (!validState(data)) {
                throw new Error("棋局資料錯誤");
            }

            if (record) {
                state.history.push(snapshot());
                state.future = [];
            }

            state.size = Number(data.size);
            state.board = clone(data.board);
            state.current = data.current;
            state.tool = data.tool || "play";
            state.moves = clone(data.moves);
            state.labels = clone(data.labels || []);
            state.captures = {
                black: Number(data.captures.black) || 0,
                white: Number(data.captures.white) || 0
            };
            state.selectedStep = Number.isInteger(data.selectedStep)
                ? data.selectedStep
                : null;

            render();
            scheduleAutosave();
        }

        function createNewGame(size = 19) {
            applyState({
                size: Number(size),
                board: emptyBoard(Number(size)),
                current: "black",
                tool: "play",
                moves: [],
                labels: [],
                captures: { black: 0, white: 0 },
                selectedStep: null
            }, { record: true });

            toast("新棋局");
        }

        function insideBoard(x, y) {
            return x >= 0 && y >= 0 && x < state.size && y < state.size;
        }

        function neighbors(x, y) {
            return [
                [x - 1, y],
                [x + 1, y],
                [x, y - 1],
                [x, y + 1]
            ].filter(([nx, ny]) => insideBoard(nx, ny));
        }

        function groupAt(board, x, y) {
            const color = board[y][x];
            const queue = [[x, y]];
            const seen = new Set([pointKey(x, y)]);
            const stones = [];
            const liberties = new Set();

            while (queue.length) {
                const [cx, cy] = queue.pop();
                stones.push([cx, cy]);

                for (const [nx, ny] of neighbors(cx, cy)) {
                    const value = board[ny][nx];
                    const key = pointKey(nx, ny);

                    if (value === null) {
                        liberties.add(key);
                    } else if (value === color && !seen.has(key)) {
                        seen.add(key);
                        queue.push([nx, ny]);
                    }
                }
            }

            return { stones, liberties };
        }

        function tryPlay(x, y, color, board) {
            if (!insideBoard(x, y) || board[y][x]) return null;

            const nextBoard = clone(board);
            const captured = [];

            nextBoard[y][x] = color;

            for (const [nx, ny] of neighbors(x, y)) {
                if (nextBoard[ny][nx] !== opposite(color)) continue;

                const enemyGroup = groupAt(nextBoard, nx, ny);

                if (enemyGroup.liberties.size === 0) {
                    enemyGroup.stones.forEach(([sx, sy]) => {
                        nextBoard[sy][sx] = null;
                        captured.push([sx, sy]);
                    });
                }
            }

            if (groupAt(nextBoard, x, y).liberties.size === 0) return null;

            return { board: nextBoard, captured };
        }

        function commit(action) {
            state.history.push(snapshot());
            state.future = [];
            action();
            render();
            scheduleAutosave();
        }

        function buildPosition(stepCount = state.moves.length) {
            const board = emptyBoard(state.size);
            const stoneNumbers = emptyBoard(state.size);
            const captures = { black: 0, white: 0 };
            const captureMarks = [];
            const moves = [];
            let current = "black";
            let moveNumber = 0;

            for (let index = 0; index < stepCount; index++) {
                const source = state.moves[index];
                const move = clone(source);

                if (move.type === "setup") {
                    if (
                        insideBoard(move.x, move.y) &&
                        board[move.y][move.x] === null
                    ) {
                        board[move.y][move.x] = move.color;
                        stoneNumbers[move.y][move.x] = null;
                        moves.push(move);
                    }
                    continue;
                }

                if (move.type === "erase") {
                    if (insideBoard(move.x, move.y)) {
                        board[move.y][move.x] = null;
                        stoneNumbers[move.y][move.x] = null;
                    }
                    moves.push(move);
                    continue;
                }

                if (move.type === "pass") {
                    moveNumber++;
                    move.number = moveNumber;
                    move.color = current;
                    moves.push(move);
                    current = opposite(current);
                    continue;
                }

                if (move.type === "play") {
                    const result = tryPlay(move.x, move.y, current, board);

                    if (!result) continue;

                    moveNumber++;
                    move.number = moveNumber;
                    move.color = current;
                    move.captured = result.captured.length;

                    result.captured.forEach(([x, y]) => {
                        captureMarks.push({
                            x,
                            y,
                            number: stoneNumbers[y][x],
                            color: board[y][x]
                        });

                        stoneNumbers[y][x] = null;
                    });

                    board.splice(
                        0,
                        board.length,
                        ...result.board.map(row => [...row])
                    );

                    stoneNumbers[move.y][move.x] = moveNumber;
                    captures[current] += result.captured.length;

                    moves.push(move);
                    current = opposite(current);
                }
            }

            return {
                board,
                stoneNumbers,
                captures,
                captureMarks,
                moves,
                current
            };
        }

        function syncCurrentPosition() {
            const full = buildPosition();

            state.board = full.board;
            state.captures = full.captures;
            state.moves = full.moves;
            state.current = full.current;

            if (
                state.selectedStep !== null &&
                state.selectedStep >= state.moves.length
            ) {
                state.selectedStep = null;
            }
        }

        function selectStep(index, showToast = true) {
            if (!state.moves.length) return;

            state.selectedStep = Math.max(-1, Math.min(index, state.moves.length - 1));
            render();

            if (showToast) {
                toast(
                    state.selectedStep < 0
                        ? "起始局面"
                        : `第 ${state.selectedStep + 1} 項`
                );
            }
        }

        function previousStep() {
            if (!state.moves.length) return;

            const current = state.selectedStep === null
                ? state.moves.length - 1
                : state.selectedStep;

            selectStep(current - 1);
        }

        function nextStep() {
            if (!state.moves.length) return;

            if (state.selectedStep === null) {
                toast("最後一步");
                return;
            }

            if (state.selectedStep >= state.moves.length - 1) {
                state.selectedStep = null;
                render();
                toast("最後一步");
                return;
            }

            selectStep(state.selectedStep + 1);
        }

        function branchAtSelectedStep() {
            if (state.selectedStep === null) return;

            const keepCount = Math.max(0, state.selectedStep + 1);

            if (keepCount >= state.moves.length) {
                state.selectedStep = null;
                return;
            }

            state.moves = state.moves.slice(0, keepCount);
            state.selectedStep = null;
            syncCurrentPosition();
        }

        function currentDisplay() {
            if (state.selectedStep === null) {
                return buildPosition();
            }

            if (state.selectedStep < 0) {
                return buildPosition(0);
            }

            return buildPosition(state.selectedStep + 1);
        }

        function playStone(x, y) {
            if (state.selectedStep !== null) {
                branchAtSelectedStep();
            }

            const result = tryPlay(x, y, state.current, state.board);

            if (!result) {
                toast("不可落子");
                return;
            }

            commit(() => {
                state.moves.push({
                    type: "play",
                    x,
                    y,
                    color: state.current,
                    captured: result.captured.length
                });

                syncCurrentPosition();
            });

            toast(result.captured.length ? `提 ${result.captured.length}` : "落子");
        }

        function setupStone(x, y) {
            if (state.selectedStep !== null) {
                branchAtSelectedStep();
            }

            if (state.board[y][x]) {
                toast("已有棋子");
                return;
            }

            commit(() => {
                state.moves.push({
                    type: "setup",
                    x,
                    y,
                    color: state.current
                });

                syncCurrentPosition();
            });

            toast("擺盤");
        }

        function addLabel(x, y) {
            if (state.selectedStep !== null) {
                branchAtSelectedStep();
            }

            const text = $("#labelText").value.trim().slice(0, 8);

            if (!text) {
                toast("輸入標記");
                return;
            }

            commit(() => {
                state.labels = state.labels.filter(label =>
                    label.x !== x || label.y !== y
                );

                state.labels.push({ x, y, text });
            });

            toast("標記");
        }

        function eraseAt(x, y) {
            if (state.selectedStep !== null) {
                branchAtSelectedStep();
            }

            const hasStone = Boolean(state.board[y][x]);
            const hasLabel = state.labels.some(label => label.x === x && label.y === y);

            if (!hasStone && !hasLabel) {
                toast("沒有項目");
                return;
            }

            commit(() => {
                if (hasStone) {
                    state.moves.push({ type: "erase", x, y });
                    syncCurrentPosition();
                }

                state.labels = state.labels.filter(label =>
                    label.x !== x || label.y !== y
                );
            });

            toast("擦除");
        }

        function passMove() {
            if (state.selectedStep !== null) {
                branchAtSelectedStep();
            }

            commit(() => {
                state.moves.push({ type: "pass" });
                syncCurrentPosition();
            });

            toast("虛手");
        }

        function undo() {
            if (!state.history.length) {
                toast("不可復原");
                return;
            }

            state.future.push(snapshot());
            applyState(state.history.pop());
            syncCurrentPosition();
            render();
            toast("復原");
        }

        function redo() {
            if (!state.future.length) {
                toast("不可重做");
                return;
            }

            state.history.push(snapshot());
            applyState(state.future.pop());
            syncCurrentPosition();
            render();
            toast("重做");
        }

        function editMove(index, action) {
            if (!state.moves[index]) return;

            const nextMoves = clone(state.moves);

            if (action === "delete") {
                nextMoves.splice(index, 1);
            }

            if (action === "up" && index > 0) {
                [nextMoves[index - 1], nextMoves[index]] =
                    [nextMoves[index], nextMoves[index - 1]];
            }

            if (action === "down" && index < nextMoves.length - 1) {
                [nextMoves[index + 1], nextMoves[index]] =
                    [nextMoves[index], nextMoves[index + 1]];
            }

            if (JSON.stringify(nextMoves) === JSON.stringify(state.moves)) return;

            state.history.push(snapshot());
            state.future = [];
            state.moves = nextMoves;
            state.selectedStep = null;

            syncCurrentPosition();
            render();
            scheduleAutosave();

            toast(action === "delete" ? "已刪除" : "已調整");
        }

        function coordinateName(x, y) {
            const letters = "ABCDEFGHJKLMNOPQRST";
            return letters[x] + (state.size - y);
        }

        function boardPosition(x, y) {
            return {
                x: state.margin + x * state.cell,
                y: state.margin + y * state.cell
            };
        }

        function drawStone(x, y, color, alpha = 1) {
            const point = boardPosition(x, y);
            const radius = state.cell * 0.43;

            const gradient = ctx.createRadialGradient(
                point.x - radius * 0.35,
                point.y - radius * 0.35,
                2,
                point.x,
                point.y,
                radius
            );

            gradient.addColorStop(0, color === "black" ? "#666" : "#fff");
            gradient.addColorStop(1, color === "black" ? "#111" : "#d6d6d6");

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = gradient;

            ctx.beginPath();
            ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#111";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        }

        function estimateTerritory(board) {
            const seen = new Set();
            const territory = { black: 0, white: 0, neutral: 0 };

            for (let y = 0; y < state.size; y++) {
                for (let x = 0; x < state.size; x++) {
                    const startKey = pointKey(x, y);

                    if (board[y][x] !== null || seen.has(startKey)) continue;

                    const queue = [[x, y]];
                    const area = [];
                    const borders = new Set();

                    seen.add(startKey);

                    while (queue.length) {
                        const [cx, cy] = queue.pop();
                        area.push([cx, cy]);

                        for (const [nx, ny] of neighbors(cx, cy)) {
                            const value = board[ny][nx];
                            const key = pointKey(nx, ny);

                            if (value === null && !seen.has(key)) {
                                seen.add(key);
                                queue.push([nx, ny]);
                            } else if (value === "black" || value === "white") {
                                borders.add(value);
                            }
                        }
                    }

                    if (borders.size === 1) {
                        territory[[...borders][0]] += area.length;
                    } else {
                        territory.neutral += area.length;
                    }
                }
            }

            return territory;
        }

        function drawBoard(display) {
            const size = state.size;
            const margin = state.margin;
            const cell = (canvas.width - margin * 2) / (size - 1);

            state.cell = cell;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const css = getComputedStyle(document.documentElement);
            const lineColor = css.getPropertyValue("--line").trim();
            const textColor = css.getPropertyValue("--text").trim();

            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 2;

            for (let i = 0; i < size; i++) {
                const p = margin + i * cell;

                ctx.beginPath();
                ctx.moveTo(margin, p);
                ctx.lineTo(canvas.width - margin, p);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(p, margin);
                ctx.lineTo(p, canvas.height - margin);
                ctx.stroke();
            }

            const starPoints = size === 19
                ? [3, 9, 15]
                : size === 13
                    ? [3, 6, 9]
                    : [2, 4, 6];

            ctx.fillStyle = lineColor;

            starPoints.forEach(x => {
                starPoints.forEach(y => {
                    ctx.beginPath();
                    ctx.arc(
                        margin + x * cell,
                        margin + y * cell,
                        6,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                });
            });

            const letters = "ABCDEFGHJKLMNOPQRST";

            ctx.fillStyle = textColor;
            ctx.font = "600 38px system-ui";
            ctx.textAlign = "center";

            for (let i = 0; i < size; i++) {
                const p = margin + i * cell;

                ctx.fillText(
                    letters[i],
                    p,
                    margin - cell * (size === 9 ? 0.70 : 0.92)
                );

                ctx.fillText(letters[i], p, canvas.height - margin + cell * 0.78);

                ctx.textAlign = "right";
                ctx.fillText(size - i, margin - cell * 0.82, p + 13);

                ctx.textAlign = "left";
                ctx.fillText(size - i, canvas.width - margin + cell * 0.82, p + 13);

                ctx.textAlign = "center";
            }

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (display.board[y][x]) {
                        drawStone(x, y, display.board[y][x]);
                    }
                }
            }

            const visibleNumbers = new Map();

            function setVisibleNumber(x, y, number, color) {
                if (!Number.isFinite(number)) return;

                const key = pointKey(x, y);
                const existing = visibleNumbers.get(key);

                if (!existing || number > existing.number) {
                    visibleNumbers.set(key, { x, y, number, color });
                }
            }

            /* 被吃白棋保留黑字；被吃黑棋的白字改為紅字 */
            display.captureMarks.forEach(mark => {
                setVisibleNumber(
                    mark.x,
                    mark.y,
                    mark.number,
                    mark.color === "white" ? "#111" : "#d52d2d"
                );
            });

            /* 現存棋子顯示本身的原手順 */
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const color = display.board[y][x];
                    const number = display.stoneNumbers[y][x];

                    if (!color || !Number.isFinite(number)) continue;

                    setVisibleNumber(
                        x,
                        y,
                        number,
                        color === "black" ? "#fff" : "#111"
                    );
                }
            }

            visibleNumbers.forEach(item => {
                const point = boardPosition(item.x, item.y);

                ctx.save();
                ctx.fillStyle = item.color;
                ctx.font = `800 ${Math.max(16, state.cell * 0.38)}px system-ui`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(String(item.number), point.x, point.y + 1);
                ctx.restore();
            });

            for (const label of state.labels || []) {
                const point = boardPosition(label.x, label.y);
                const stone = display.board[label.y][label.x];

                ctx.save();
                ctx.font = `700 ${Math.max(13, state.cell * 0.3)}px system-ui`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.lineWidth = 3;
                ctx.strokeStyle = stone === "black" ? "#111" : "#fff";
                ctx.fillStyle = stone === "black" ? "#fff" : "#b01919";
                ctx.strokeText(label.text, point.x, point.y);
                ctx.fillText(label.text, point.x, point.y);
                ctx.restore();
            }

            ctx.textBaseline = "alphabetic";

            if (
                state.hover &&
                state.selectedStep === null &&
                state.tool === "play"
            ) {
                const preview = tryPlay(
                    state.hover.x,
                    state.hover.y,
                    state.current,
                    state.board
                );

                if (preview) {
                    drawStone(
                        state.hover.x,
                        state.hover.y,
                        state.current,
                        0.38
                    );
                }
            }
        }

        function render() {
            const display = currentDisplay();
            const territory = estimateTerritory(display.board);

            drawBoard(display);

            $("#caps").textContent =
                `${display.captures.black} : ${display.captures.white}`;

            $("#territory").textContent =
                `${territory.black} : ${territory.white}`;

            $("#score").textContent =
                `${territory.black + display.captures.black} : ${territory.white + display.captures.white}`;

            $("#status").textContent = state.selectedStep === null
                ? `${state.current === "black" ? "黑" : "白"}`
                : state.selectedStep < 0
                    ? "起始局面"
                    : `第 ${state.selectedStep + 1} 項`;

            document.querySelectorAll("[data-color]").forEach(button => {
                button.classList.toggle(
                    "active",
                    button.dataset.color === state.current
                );
            });

            document.querySelectorAll("[data-tool]").forEach(button => {
                button.classList.toggle(
                    "active",
                    button.dataset.tool === state.tool
                );
            });

            document.querySelectorAll("[data-size]").forEach(button => {
                button.classList.toggle(
                    "active",
                    Number(button.dataset.size) === state.size
                );
            });

            $("#undo").disabled = !state.history.length;
            $("#redo").disabled = !state.future.length;

            $("#moves").innerHTML = state.moves.map((move, index) => {
                let text;

                if (move.type === "setup") {
                    text = `擺 ${move.color === "black" ? "黑" : "白"} ${coordinateName(move.x, move.y)}`;
                } else if (move.type === "erase") {
                    text = `擦 ${coordinateName(move.x, move.y)}`;
                } else if (move.type === "pass") {
                    text = `${move.number}. ${move.color === "black" ? "黑" : "白"} 虛`;
                } else {
                    text = `${move.number}. ${move.color === "black" ? "黑" : "白"} ${coordinateName(move.x, move.y)}`;

                    if (move.captured) {
                        text += ` 提${move.captured}`;
                    }
                }

                const currentClass = state.selectedStep === index ? "current" : "";

                return `
      <div class="move-row ${currentClass}">
        <button class="move-name" type="button" data-select-step="${index}" title="選取後可按方向鍵前進或後退">${text}</button>
        <button class="btn move-action" data-move-action="up" data-index="${index}" type="button" title="上移">↑</button>
        <button class="btn move-action" data-move-action="down" data-index="${index}" type="button" title="下移">↓</button>
        <button class="btn danger move-action" data-move-action="delete" data-index="${index}" type="button" title="刪除">×</button>
      </div>
    `;
            }).join("") || "<div class='status-text'>—</div>";

            document.querySelectorAll("[data-select-step]").forEach(button => {
                button.addEventListener("click", () => {
                    selectStep(Number(button.dataset.selectStep));
                });
            });

            document.querySelectorAll("[data-move-action]").forEach(button => {
                button.addEventListener("click", event => {
                    event.stopPropagation();

                    editMove(
                        Number(button.dataset.index),
                        button.dataset.moveAction
                    );
                });
            });
        }

        function pointFromEvent(event) {
            const rect = canvas.getBoundingClientRect();

            const canvasX =
                (event.clientX - rect.left) * canvas.width / rect.width;

            const canvasY =
                (event.clientY - rect.top) * canvas.height / rect.height;

            const x = Math.round((canvasX - state.margin) / state.cell);
            const y = Math.round((canvasY - state.margin) / state.cell);

            return insideBoard(x, y) ? { x, y } : null;
        }

        canvas.addEventListener("pointermove", event => {
            const rect = canvas.getBoundingClientRect();

            boardWrap.style.setProperty(
                "--cursor-x",
                `${event.clientX - rect.left}px`
            );

            boardWrap.style.setProperty(
                "--cursor-y",
                `${event.clientY - rect.top}px`
            );

            boardWrap.classList.remove("cursor-hidden");
            state.hover = pointFromEvent(event);
            render();
        });

        canvas.addEventListener("pointerleave", () => {
            boardWrap.classList.add("cursor-hidden");
            state.hover = null;
            render();
        });

        canvas.addEventListener("click", event => {
            const point = pointFromEvent(event);

            if (!point) return;

            if (state.tool === "play") {
                playStone(point.x, point.y);
            } else if (state.tool === "setup") {
                setupStone(point.x, point.y);
            } else if (state.tool === "label") {
                addLabel(point.x, point.y);
            } else if (state.tool === "erase") {
                eraseAt(point.x, point.y);
            }
        });

        document.querySelectorAll("[data-color]").forEach(button => {
            button.addEventListener("click", () => {
                state.current = button.dataset.color;
                render();
                scheduleAutosave();
            });
        });

        document.querySelectorAll("[data-tool]").forEach(button => {
            button.addEventListener("click", () => {
                state.tool = button.dataset.tool;
                render();
            });
        });

        document.querySelectorAll("[data-size]").forEach(button => {
            button.addEventListener("click", () => {
                const nextSize = Number(button.dataset.size);

                if (nextSize === state.size) return;

                if (confirm("更改路數會清盤，繼續？")) {
                    createNewGame(nextSize);
                }
            });
        });

        let autosaveTimer;

        function scheduleAutosave() {
            clearTimeout(autosaveTimer);
            $("#autosaveStatus").textContent = "儲存";

            autosaveTimer = setTimeout(() => {
                try {
                    localStorage.setItem(DRAFT_KEY, JSON.stringify(snapshot()));
                    $("#autosaveStatus").textContent = "已存";
                } catch {
                    $("#autosaveStatus").textContent = "失敗";
                }
            }, 350);
        }

        function toast(message) {
            const box = $("#toast");

            box.textContent = message;
            box.classList.add("show");

            clearTimeout(box._timer);

            box._timer = setTimeout(() => {
                box.classList.remove("show");
            }, 1600);
        }

        function setLayout(position) {
            const allowed = ["right", "left", "top", "bottom"];
            const nextPosition = allowed.includes(position) ? position : "right";

            document.documentElement.dataset.layout = nextPosition;

            try {
                localStorage.setItem(LAYOUT_KEY, nextPosition);
            } catch { }

            document
                .querySelectorAll("#layoutButtons button[data-layout]")
                .forEach(button => {
                    button.classList.toggle(
                        "active",
                        button.dataset.layout === nextPosition
                    );
                });
        }

        document
            .querySelectorAll("#layoutButtons button[data-layout]")
            .forEach(button => {
                button.addEventListener("click", () => {
                    setLayout(button.dataset.layout);
                });
            });

        $("#pass").addEventListener("click", passMove);
        $("#undo").addEventListener("click", undo);
        $("#redo").addEventListener("click", redo);

        $("#clear").addEventListener("click", () => {
            $("#confirm").showModal();
        });

        $("#cancelClear").addEventListener("click", () => {
            $("#confirm").close();
        });

        $("#confirmClear").addEventListener("click", () => {
            $("#confirm").close();
            createNewGame(state.size);
        });

        $("#themeBtn").addEventListener("click", () => {
            const root = document.documentElement;

            root.dataset.theme =
                root.dataset.theme === "dark" ? "light" : "dark";

            try {
                localStorage.setItem(THEME_KEY, root.dataset.theme);
            } catch { }

            render();
        });

        function download(blob, filename) {
            const link = document.createElement("a");

            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();

            setTimeout(() => {
                URL.revokeObjectURL(link.href);
            }, 1000);
        }

        $("#jsonSave").addEventListener("click", () => {
            download(
                new Blob(
                    [JSON.stringify(snapshot(), null, 2)],
                    { type: "application/json" }
                ),
                "go-game.json"
            );
        });

        $("#jsonLoad").addEventListener("click", () => {
            $("#file").click();
        });

        $("#file").addEventListener("change", async event => {
            const file = event.target.files[0];

            if (!file) return;

            try {
                if (file.size > 5 * 1024 * 1024) {
                    throw new Error("檔案過大");
                }

                applyState(
                    JSON.parse(await file.text()),
                    { record: true }
                );

                syncCurrentPosition();
                render();
                toast("已載入");
            } catch (error) {
                toast(`失敗：${error.message}`);
            } finally {
                event.target.value = "";
            }
        });

        $("#png").addEventListener("click", () => {
            drawBoard(currentDisplay());

            canvas.toBlob(blob => {
                download(blob, `go-${state.size}x${state.size}.png`);
            }, "image/png");
        });

        document.addEventListener("keydown", event => {
            const tag = document.activeElement.tagName;
            const editing = ["INPUT", "TEXTAREA", "SELECT"].includes(tag);

            if (editing) {
                if (event.key === "Escape") {
                    document.activeElement.blur();
                }

                return;
            }

            const key = event.key.toLowerCase();
            const modifier = event.ctrlKey || event.metaKey;

            if (modifier && key === "z") {
                event.preventDefault();
                event.shiftKey ? redo() : undo();
                return;
            }

            if (modifier && key === "y") {
                event.preventDefault();
                redo();
                return;
            }

            if ($("#confirm").open) {
                if (event.key === "Escape") {
                    $("#cancelClear").click();
                }

                if (event.key === "Enter") {
                    $("#confirmClear").click();
                }

                return;
            }

            /* 點選手順後，可用方向鍵逐步前進或後退 */
            if (
                state.selectedStep !== null &&
                ["arrowleft", "arrowright", "arrowup", "arrowdown"].includes(key)
            ) {
                event.preventDefault();

                if (key === "arrowleft" || key === "arrowup") {
                    previousStep();
                } else {
                    nextStep();
                }

                return;
            }

            switch (key) {
                case " ":
                    event.preventDefault();
                    passMove();
                    break;

                case "p":
                    state.tool = "play";
                    toast("落子");
                    render();
                    break;

                case "s":
                    state.tool = "setup";
                    toast("擺盤");
                    render();
                    break;

                case "l":
                    state.tool = "label";
                    $("#labelText").focus();
                    toast("標字");
                    render();
                    break;

                case "e":
                case "x":
                    state.tool = "erase";
                    toast("擦除");
                    render();
                    break;

                case "b":
                    state.current = "black";
                    toast("黑");
                    render();
                    scheduleAutosave();
                    break;

                case "w":
                    state.current = "white";
                    toast("白");
                    render();
                    scheduleAutosave();
                    break;

                case "r":
                    $("#clear").click();
                    break;

                case "1":
                    setLayout("left");
                    toast("左");
                    break;

                case "2":
                    setLayout("right");
                    toast("右");
                    break;

                case "3":
                    setLayout("top");
                    toast("上");
                    break;

                case "4":
                    setLayout("bottom");
                    toast("下");
                    break;

                case "9":
                    if (confirm("改為 9 路並清盤？")) {
                        createNewGame(9);
                    }
                    break;

                case "t":
                    $("#themeBtn").click();
                    break;

                case "g":
                    $("#png").click();
                    break;

                case "j":
                    $("#jsonSave").click();
                    break;

                case "o":
                    $("#jsonLoad").click();
                    break;

                case "escape":
                    if (state.selectedStep !== null) {
                        state.selectedStep = null;
                        render();
                        toast("回到最後一步");
                    } else {
                        state.hover = null;
                        render();
                    }
                    break;
            }
        });

        try {
            const saved = JSON.parse(localStorage.getItem(DRAFT_KEY));

            if (validState(saved)) {
                applyState(saved);
                syncCurrentPosition();
            } else {
                createNewGame(19);
            }
        } catch {
            createNewGame(19);
        }

        try {
            document.documentElement.dataset.theme =
                localStorage.getItem(THEME_KEY) || "light";
        } catch {
            document.documentElement.dataset.theme = "light";
        }

        try {
            setLayout(localStorage.getItem(LAYOUT_KEY) || "right");
        } catch {
            setLayout("right");
        }

        render();
    </script>
</body>

</html>
