<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圍棋 - 玩家 vs RAVE-MCTS AI</title>
<style>
  body {
    font-family: "Microsoft JhengHei", "PingFang HK", sans-serif;
    background: #2b2b2b;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    margin: 0;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  #boardWrap { position: relative; }
  canvas { background: #dcb35c; border-radius: 4px; cursor: pointer; }
  #panel {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  button, select {
    background: #444;
    color: #eee;
    border: 1px solid #666;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover, select:hover { background: #555; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status {
    margin-top: 10px;
    font-size: 15px;
    min-height: 22px;
    text-align: center;
    max-width: 640px;
  }
  #scoreBoard {
    display: flex;
    gap: 20px;
    margin-top: 6px;
    font-size: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle;}
  .black { background:#111; }
  .white { background:#fafafa; border:1px solid #999;}
  #thinking {
    font-size: 13px;
    color: #9ad;
    min-height: 18px;
  }
  #difficultyDesc {
    font-size: 12px;
    color: #ccc;
    max-width: 640px;
    text-align: center;
    margin-top: 2px;
    min-height: 16px;
  }
  .ruleNote {
    font-size: 12px;
    color: #aaa;
    max-width: 640px;
    text-align: center;
    margin-top: 4px;
  }
  #selfTestResult {
    font-size: 11px;
    color: #7c7;
    max-width: 640px;
    text-align: center;
    margin-top: 8px;
    white-space: pre-line;
  }
  #selfTestResult.failed { color: #e66; }
</style>
</head>
<body>

<h1>圍棋對弈 - 玩家（黑）vs RAVE-MCTS AI（白）</h1>

<div id="panel">
  <label>棋盤大小：
    <select id="boardSize">
      <option value="9">9x9</option>
      <option value="13">13x13</option>
      <option value="19">19x19</option>
    </select>
  </label>
  <label>AI難度：
    <select id="aiLevel">
      <option value="beginner">新手</option>
      <option value="easy">簡單</option>
      <option value="normal" selected>普通</option>
      <option value="hard">較強</option>
      <option value="expert">專家</option>
      <option value="master">大師（UCT+RAVE深搜）</option>
    </select>
  </label>
  <label>計分規則：
    <select id="scoringRule">
      <option value="chinese" selected>中國數子法（棋子+領地）</option>
      <option value="japanese">日本目數法（只算領地）</option>
    </select>
  </label>
  <button id="newGameBtn">開新局</button>
  <button id="passBtn">停一手 (Pass)</button>
  <button id="undoBtn">悔棋</button>
</div>

<div id="difficultyDesc"></div>

<div id="boardWrap">
  <canvas id="board"></canvas>
</div>

<div id="status">請落子</div>
<div id="thinking"></div>
<div id="scoreBoard">
  <span><span class="dot black"></span>黑（玩家）提子數: <span id="blackCaptures">0</span></span>
  <span><span class="dot white"></span>白（AI）提子數: <span id="whiteCaptures">0</span></span>
</div>
<div class="ruleNote">貼目固定為 6.5（白棋加分）。「大師」難度使用 UCT + RAVE（AMAF）混合評估：早期節點以全局同色落點的模擬結果快速估值，隨訪問次數增加逐漸轉為精確的樹搜尋統計，收斂速度比純UCT更快。</div>
<div id="selfTestResult"></div>

<script>
(function () {
  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const KOMI = 6.5;
  let size = 9;
  let cell = 40;
  let margin = 30;
  let board = [];
  let history = [];
  let current = BLACK;
  let captures = { [BLACK]: 0, [WHITE]: 0 };
  let lastBoardSnapshot = null;
  let passCount = 0;
  let gameOver = false;
  let aiThinking = false;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const thinkingEl = document.getElementById('thinking');
  const difficultyDescEl = document.getElementById('difficultyDesc');
  const blackCapEl = document.getElementById('blackCaptures');
  const whiteCapEl = document.getElementById('whiteCaptures');
  const passBtn = document.getElementById('passBtn');
  const undoBtn = document.getElementById('undoBtn');
  const aiLevelSelect = document.getElementById('aiLevel');
  const selfTestEl = document.getElementById('selfTestResult');

  const DIFFICULTY = {
    beginner: { engine: 'flat', candidateLimit: 6,  totalSims: 20,  maxPlyPerPlayout: 25, temperature: 45, blindSpotRate: 0.35,
      desc: '新手：常漏看叫吃與逃跑機會，落點隨機性高，適合剛學會規則的玩家。' },
    easy:     { engine: 'flat', candidateLimit: 8,  totalSims: 40,  maxPlyPerPlayout: 35, temperature: 25, blindSpotRate: 0.15,
      desc: '簡單：偶爾漏看戰術機會，仍有明顯隨機性，適合練習基本攻殺。' },
    normal:   { engine: 'flat', candidateLimit: 12, totalSims: 90,  maxPlyPerPlayout: 50, temperature: 10, blindSpotRate: 0.05,
      desc: '普通：大致穩健，讀效範圍中等，偶爾仍會失誤。' },
    hard:     { engine: 'flat', candidateLimit: 16, totalSims: 160, maxPlyPerPlayout: 60, temperature: 3,  blindSpotRate: 0.0,
      desc: '較強：幾乎總是選擇評分最高的候選點，戰術幾乎不漏看。' },
    expert:   { engine: 'flat', candidateLimit: 20, totalSims: 260, maxPlyPerPlayout: 70, temperature: 0.5, blindSpotRate: 0.0,
      desc: '專家：模擬量大、候選範圍廣，接近貪心＋推演雙重最優解，思考時間較長。' },
    master:   { engine: 'uct-rave', candidateLimit: 24, iterations: 500, maxPlyPerPlayout: 45, timeBudgetMs: 4500,
      raveEquivParam: 300, explorationConst: 1.0, blindSpotRate: 0.0,
      desc: '大師：UCT樹搜尋結合RAVE（AMAF）快速評估，早期節點收斂更快、後期回歸精確統計，棋力為所有層級中最高，單手思考可達數秒。' }
  };

  function updateDifficultyDesc() {
    const level = aiLevelSelect.value;
    difficultyDescEl.textContent = DIFFICULTY[level].desc;
  }
  aiLevelSelect.addEventListener('change', updateDifficultyDesc);

  function initBoard(newSize) {
    size = newSize;
    cell = size === 19 ? 30 : (size === 13 ? 36 : 40);
    margin = cell;
    const dim = margin * 2 + cell * (size - 1);
    canvas.width = dim;
    canvas.height = dim;
    board = Array.from({ length: size }, () => Array(size).fill(EMPTY));
    history = [];
    current = BLACK;
    captures = { [BLACK]: 0, [WHITE]: 0 };
    lastBoardSnapshot = null;
    passCount = 0;
    gameOver = false;
    aiThinking = false;
    setButtonsEnabled(true);
    updateScoreUI();
    setStatus('請落子（黑棋先行）');
    thinkingEl.textContent = '';
    updateDifficultyDesc();
    draw();
  }

  function setButtonsEnabled(enabled) {
    passBtn.disabled = !enabled;
    undoBtn.disabled = !enabled;
  }

  function cloneBoard(b) { return b.map(row => row.slice()); }

  function boardsEqual(a, b) {
    if (a.length !== b.length) return false;
    for (let y = 0; y < a.length; y++)
      for (let x = 0; x < a.length; x++)
        if (a[y][x] !== b[y][x]) return false;
    return true;
  }

  function inBoundsForSize(x, y, s) { return x >= 0 && x < s && y >= 0 && y < s; }
  function inBounds(x, y) { return inBoundsForSize(x, y, size); }

  function neighborsForBoard(x, y, s) {
    const result = [];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy]) => {
      const nx = x+dx, ny = y+dy;
      if (inBoundsForSize(nx, ny, s)) result.push([nx, ny]);
    });
    return result;
  }
  function neighbors(x, y) { return neighborsForBoard(x, y, size); }

  function diagonalNeighbors(x, y) {
    const result = [];
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy]) => {
      const nx = x+dx, ny = y+dy;
      if (inBounds(nx, ny)) result.push([nx, ny]);
    });
    return result;
  }

  function getGroupOnBoard(b, x, y, s) {
    const color = b[y][x];
    const visited = new Set();
    const liberties = new Set();
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      const key = cx + ',' + cy;
      if (visited.has(key)) continue;
      visited.add(key);
      for (const [nx, ny] of neighborsForBoard(cx, cy, s)) {
        if (b[ny][nx] === EMPTY) {
          liberties.add(nx + ',' + ny);
        } else if (b[ny][nx] === color && !visited.has(nx + ',' + ny)) {
          stack.push([nx, ny]);
        }
      }
    }
    return { stones: visited, liberties };
  }
  function getGroup(b, x, y) { return getGroupOnBoard(b, x, y, size); }

  function opponent(c) { return c === BLACK ? WHITE : BLACK; }

  /**
   * Core legality check. Order of operations: place stone -> capture opponent groups with zero
   * liberties -> THEN check own group liberties (so captures correctly open up liberties for the
   * just-placed stone) -> simple ko check on single-stone recaptures.
   */
  function attemptMoveOnBoard(b, x, y, color, prevSnapshot, s) {
    if (b[y][x] !== EMPTY) return null;
    const trial = cloneBoard(b);
    trial[y][x] = color;

    let capturedStones = [];
    const opp = opponent(color);
    for (const [nx, ny] of neighborsForBoard(x, y, s)) {
      if (trial[ny][nx] === opp) {
        const { stones, liberties } = getGroupOnBoard(trial, nx, ny, s);
        if (liberties.size === 0) {
          stones.forEach(k => {
            const [sx, sy] = k.split(',').map(Number);
            trial[sy][sx] = EMPTY;
          });
          capturedStones = capturedStones.concat([...stones]);
        }
      }
    }

    const { liberties: selfLibs } = getGroupOnBoard(trial, x, y, s);
    if (selfLibs.size === 0) return null;

    if (capturedStones.length === 1 && prevSnapshot && boardsEqual(trial, prevSnapshot)) {
      return null;
    }

    return { newBoard: trial, capturedCount: capturedStones.length };
  }

  function attemptMove(b, x, y, color, prevSnapshot) {
    return attemptMoveOnBoard(b, x, y, color, prevSnapshot, size);
  }

  function placeStone(x, y, color) {
    const result = attemptMove(board, x, y, color, lastBoardSnapshot);
    if (!result) return false;
    history.push({
      board: cloneBoard(board),
      current, captures: { ...captures },
      lastBoardSnapshot: lastBoardSnapshot ? cloneBoard(lastBoardSnapshot) : null,
      passCount
    });
    lastBoardSnapshot = cloneBoard(board);
    board = result.newBoard;
    captures[color] += result.capturedCount;
    passCount = 0;
    updateScoreUI();
    return true;
  }

  function updateScoreUI() {
    blackCapEl.textContent = captures[BLACK];
    whiteCapEl.textContent = captures[WHITE];
  }

  function setStatus(msg) { statusEl.textContent = msg; }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#dcb35c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#3a2a10';
    ctx.lineWidth = 1;
    for (let i = 0; i < size; i++) {
      const pos = margin + i * cell;
      ctx.beginPath(); ctx.moveTo(margin, pos); ctx.lineTo(margin + cell * (size - 1), pos); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pos, margin); ctx.lineTo(pos, margin + cell * (size - 1)); ctx.stroke();
    }
    const starPoints = getStarPoints(size);
    ctx.fillStyle = '#3a2a10';
    starPoints.forEach(([sx, sy]) => {
      ctx.beginPath();
      ctx.arc(margin + sx * cell, margin + sy * cell, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (board[y][x] !== EMPTY) drawStone(x, y, board[y][x]);
      }
    }
  }

  function drawStone(x, y, color) {
    const cx = margin + x * cell;
    const cy = margin + y * cell;
    const r = cell * 0.42;
    const grad = ctx.createRadialGradient(cx - r/3, cy - r/3, r/6, cx, cy, r);
    if (color === BLACK) { grad.addColorStop(0, '#555'); grad.addColorStop(1, '#000'); }
    else { grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ccc'); }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  function getStarPoints(n) {
    if (n === 9) return [[2,2],[6,2],[2,6],[6,6],[4,4]];
    if (n === 13) return [[3,3],[9,3],[3,9],[9,9],[6,6]];
    if (n === 19) return [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]];
    return [];
  }

  function pixelToCoord(px, py) {
    const x = Math.round((px - margin) / cell);
    const y = Math.round((py - margin) / cell);
    return { x, y };
  }

  canvas.addEventListener('click', (e) => {
    if (gameOver || current !== BLACK || aiThinking) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (e.clientX - rect.left) * scaleX;
    const py = (e.clientY - rect.top) * scaleY;
    const { x, y } = pixelToCoord(px, py);
    if (!inBounds(x, y)) return;

    const ok = placeStone(x, y, BLACK);
    if (!ok) {
      setStatus('此點不能落子（違反打劫規則，或無法吃子且自身無氣的自殺禁手）');
      return;
    }
    draw();
    current = WHITE;
    setButtonsEnabled(false);
    setStatus('AI思考中...');
    setTimeout(runAiMove, 50);
  });

  passBtn.addEventListener('click', () => {
    if (gameOver || current !== BLACK || aiThinking) return;
    passCount++;
    history.push({ board: cloneBoard(board), current, captures: {...captures}, lastBoardSnapshot: lastBoardSnapshot?cloneBoard(lastBoardSnapshot):null, passCount: passCount-1 });
    if (passCount >= 2) { endGame(); return; }
    current = WHITE;
    setButtonsEnabled(false);
    setStatus('你選擇停一手。AI思考中...');
    setTimeout(runAiMove, 50);
  });

  undoBtn.addEventListener('click', () => {
    if (history.length < 2 || aiThinking) return;
    history.pop();
    const prev = history.pop();
    board = prev.board;
    current = prev.current;
    captures = prev.captures;
    lastBoardSnapshot = prev.lastBoardSnapshot;
    passCount = prev.passCount;
    gameOver = false;
    setButtonsEnabled(true);
    updateScoreUI();
    draw();
    setStatus('已悔棋，請落子');
  });

  document.getElementById('newGameBtn').addEventListener('click', () => {
    initBoard(parseInt(document.getElementById('boardSize').value, 10));
  });

  function endGame() {
    gameOver = true;
    setButtonsEnabled(false);
    const rule = document.getElementById('scoringRule').value;
    const result = computeScore(rule);
    setStatus(`對局結束（${rule === 'chinese' ? '中國數子法' : '日本目數法'}）。黑 ${result.black.toFixed(1)} - 白 ${result.white.toFixed(1)}。勝者：${result.winner}`);
  }

  function isTrueEye(b, x, y, color) {
    if (b[y][x] !== EMPTY) return false;
    for (const [nx, ny] of neighbors(x, y)) {
      if (b[ny][nx] !== color) return false;
    }
    const diags = diagonalNeighbors(x, y);
    let ownDiag = 0;
    diags.forEach(([dx, dy]) => { if (b[dy][dx] === color) ownDiag++; });
    if (diags.length === 4) return ownDiag >= 3;
    return ownDiag >= diags.length;
  }

  function floodEmptyRegions(b) {
    const visited = Array.from({ length: size }, () => Array(size).fill(false));
    const regions = [];
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (b[y][x] === EMPTY && !visited[y][x]) {
          const region = [];
          const stack = [[x, y]];
          const borderColors = new Set();
          visited[y][x] = true;
          while (stack.length) {
            const [cx, cy] = stack.pop();
            region.push([cx, cy]);
            for (const [nx, ny] of neighbors(cx, cy)) {
              if (b[ny][nx] === EMPTY && !visited[ny][nx]) {
                visited[ny][nx] = true;
                stack.push([nx, ny]);
              } else if (b[ny][nx] !== EMPTY) {
                borderColors.add(b[ny][nx]);
              }
            }
          }
          regions.push({ region, borderColors });
        }
      }
    }
    return regions;
  }

  function computeScore(rule) {
    const regions = floodEmptyRegions(board);
    let blackTerritory = 0, whiteTerritory = 0;
    regions.forEach(({ region, borderColors }) => {
      if (borderColors.size === 1) {
        if (borderColors.has(BLACK)) blackTerritory += region.length;
        else if (borderColors.has(WHITE)) whiteTerritory += region.length;
      }
    });

    let blackScore, whiteScore;
    if (rule === 'chinese') {
      let blackStones = 0, whiteStones = 0;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (board[y][x] === BLACK) blackStones++;
        else if (board[y][x] === WHITE) whiteStones++;
      }
      blackScore = blackStones + blackTerritory;
      whiteScore = whiteStones + whiteTerritory + KOMI;
    } else {
      blackScore = blackTerritory + captures[BLACK];
      whiteScore = whiteTerritory + captures[WHITE] + KOMI;
    }
    const winner = blackScore > whiteScore ? '黑棋（玩家）' : '白棋（AI）';
    return { black: blackScore, white: whiteScore, winner };
  }

  function generateLegalMoves(b, color, prevSnapshot, limit, skipEyes) {
    const moves = [];
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (skipEyes && isTrueEye(b, x, y, color)) continue;
        const result = attemptMove(b, x, y, color, prevSnapshot);
        if (result) {
          moves.push({ x, y, capturedCount: result.capturedCount, newBoard: result.newBoard });
        }
      }
    }
    if (limit && moves.length > limit) {
      moves.sort((a, b2) => b2.capturedCount - a.capturedCount);
      return moves.slice(0, limit);
    }
    return moves;
  }

  function quickHeuristicScore(x, y, capturedCount, b, color) {
    let score = capturedCount * 50;
    let neighborStones = 0;
    for (const [nx, ny] of neighbors(x, y)) {
      if (b[ny][nx] !== EMPTY) neighborStones++;
    }
    score += neighborStones * 2;
    const center = (size - 1) / 2;
    const distToCenter = Math.abs(x - center) + Math.abs(y - center);
    score += Math.max(0, size - distToCenter) * 0.3;
    const opp = opponent(color);
    let putsOpponentInAtari = false;
    for (const [nx, ny] of neighbors(x, y)) {
      if (b[ny][nx] === opp) {
        const { liberties } = getGroup(b, nx, ny);
        if (liberties.size === 1) { score += 30; putsOpponentInAtari = true; }
      }
    }
    for (const [nx, ny] of neighbors(x, y)) {
      if (b[ny][nx] === color) {
        const { liberties } = getGroup(b, nx, ny);
        if (liberties.size === 1) score += 25;
      }
    }
    return { score, putsOpponentInAtari };
  }

  // Policy-biased random move for rollouts, favoring captures and atari-escapes over pure random.
  function policyBiasedMove(b, color, prevSnapshot) {
    const size2 = size * size;
    const capturingMoves = [];
    const savingMoves = [];
    const otherMoves = [];
    const tried = new Set();
    const maxScan = Math.min(size2, 70);

    for (let attempt = 0; attempt < maxScan; attempt++) {
      const idx = Math.floor(Math.random() * size2);
      if (tried.has(idx)) continue;
      tried.add(idx);
      const x = idx % size, y = Math.floor(idx / size);
      if (isTrueEye(b, x, y, color)) continue;
      const result = attemptMove(b, x, y, color, prevSnapshot);
      if (!result) continue;

      if (result.capturedCount > 0) {
        capturingMoves.push({ x, y, newBoard: result.newBoard });
        continue;
      }
      let savesOwnAtari = false;
      for (const [nx, ny] of neighbors(x, y)) {
        if (b[ny][nx] === color) {
          const { liberties } = getGroup(b, nx, ny);
          if (liberties.size === 1) { savesOwnAtari = true; break; }
        }
      }
      if (savesOwnAtari) savingMoves.push({ x, y, newBoard: result.newBoard });
      else otherMoves.push({ x, y, newBoard: result.newBoard });

      if (capturingMoves.length + savingMoves.length + otherMoves.length >= 24) break;
    }

    if (capturingMoves.length > 0 && Math.random() < 0.85) {
      return capturingMoves[Math.floor(Math.random() * capturingMoves.length)];
    }
    if (savingMoves.length > 0 && Math.random() < 0.7) {
      return savingMoves[Math.floor(Math.random() * savingMoves.length)];
    }
    const pool = otherMoves.length ? otherMoves : (capturingMoves.length ? capturingMoves : savingMoves);
    if (pool.length === 0) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function policyBiasedPlayout(startBoard, startColor, maxPly) {
    let b = startBoard;
    let cur = startColor;
    let prevSnap = null;
    let passes = 0;
    let ply = 0;
    while (passes < 2 && ply < maxPly) {
      const mv = policyBiasedMove(b, cur, prevSnap);
      if (!mv) {
        passes++;
      } else {
        passes = 0;
        prevSnap = b;
        b = mv.newBoard;
      }
      cur = opponent(cur);
      ply++;
    }
    let blackCount = 0, whiteCount = 0;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (b[y][x] === BLACK) blackCount++;
      else if (b[y][x] === WHITE) whiteCount++;
    }
    return blackCount - whiteCount;
  }

  // Playout variant that also LOGS every (color, move) played, needed for RAVE/AMAF updates.
  function policyBiasedPlayoutWithLog(startBoard, startColor, maxPly) {
    let b = startBoard;
    let cur = startColor;
    let prevSnap = null;
    let passes = 0;
    let ply = 0;
    const moveLog = [];
    while (passes < 2 && ply < maxPly) {
      const mv = policyBiasedMove(b, cur, prevSnap);
      if (!mv) {
        passes++;
      } else {
        passes = 0;
        prevSnap = b;
        b = mv.newBoard;
        moveLog.push({ color: cur, x: mv.x, y: mv.y });
      }
      cur = opponent(cur);
      ply++;
    }
    let blackCount = 0, whiteCount = 0;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (b[y][x] === BLACK) blackCount++;
      else if (b[y][x] === WHITE) whiteCount++;
    }
    return { result: blackCount - whiteCount, moveLog };
  }

  function softmaxPick(items, temperature) {
    if (temperature <= 0.05) {
      let best = items[0];
      for (const it of items) if (it.value > best.value) best = it;
      return best;
    }
    const maxV = Math.max(...items.map(i => i.value));
    const weights = items.map(i => Math.exp((i.value - maxV) / temperature));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weights[i];
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  }

  // ---------- Flat engine (beginner..expert): one-ply candidate list + rollout averaging ----------
  function flatEngineSelectMove(color, settings) {
    const ignoreTactics = Math.random() < settings.blindSpotRate;
    let candidates = generateLegalMoves(board, color, lastBoardSnapshot, null, true);
    if (candidates.length === 0) return null;

    candidates.forEach(c => {
      const { score, putsOpponentInAtari } = quickHeuristicScore(c.x, c.y, c.capturedCount, board, color);
      c.heuristic = score;
      c.tactical = putsOpponentInAtari || c.capturedCount > 0;
    });

    if (ignoreTactics) {
      const nonTactical = candidates.filter(c => !c.tactical);
      if (nonTactical.length > 0) candidates = nonTactical;
    }

    candidates.sort((a, b) => b.heuristic - a.heuristic);
    if (candidates.length > settings.candidateLimit) {
      candidates = candidates.slice(0, settings.candidateLimit);
    }

    const simsPerCandidate = Math.max(1, Math.floor(settings.totalSims / candidates.length));
    const opp = opponent(color);

    const evaluated = candidates.map(c => {
      let total = 0;
      for (let i = 0; i < simsPerCandidate; i++) {
        const rawResult = policyBiasedPlayout(c.newBoard, opp, settings.maxPlyPerPlayout);
        const scoreForColor = color === BLACK ? rawResult : -rawResult;
        total += scoreForColor;
      }
      const avg = total / simsPerCandidate + c.heuristic * 0.05;
      return { x: c.x, y: c.y, value: avg };
    });

    return softmaxPick(evaluated, settings.temperature);
  }

  // ---------- UCT + RAVE engine (master tier) ----------
  // Each node stores standard MCTS stats (visits, winValue) PLUS AMAF maps keyed by move "x,y":
  // amafVisits/amafWins record outcomes for EVERY occurrence of a move by this node's mover color,
  // both inside the tree beyond this node and in the random playout tail. This lets a move's value
  // be estimated from many more samples than just "how many times was this exact child visited",
  // which is what makes RAVE converge faster than plain UCT with the same iteration budget.
  function createRaveNode(nodeBoard, color, lastSnap, parent, move) {
    return {
      board: nodeBoard, color, lastSnap, parent, move,
      children: [], visits: 0, winValue: 0,
      untried: null,
      amafVisits: new Map(), amafWins: new Map()
    };
  }

  function moveKey(x, y) { return x + ',' + y; }

  function uctRaveSelectChild(node, explorationConst, raveEquivParam) {
    let best = null, bestVal = -Infinity;
    const beta = node.visits > 0
      ? Math.sqrt(raveEquivParam / (3 * node.visits + raveEquivParam))
      : 1.0;
    for (const child of node.children) {
      const key = moveKey(child.move.x, child.move.y);
      const qUct = child.visits > 0 ? (child.winValue / child.visits) : 0;
      const amafV = node.amafVisits.get(key) || 0;
      const amafW = node.amafWins.get(key) || 0;
      const qRave = amafV > 0 ? (amafW / amafV) : 0;
      const qBlend = (1 - beta) * qUct + beta * qRave;
      const explore = explorationConst * Math.sqrt(Math.log(node.visits + 1) / (child.visits + 1));
      const val = qBlend + explore;
      if (val > bestVal) { bestVal = val; best = child; }
    }
    return best;
  }

  function expandRaveNode(node, candidateLimit) {
    if (node.untried === null) {
      node.untried = generateLegalMoves(node.board, node.color, node.lastSnap, candidateLimit, true);
    }
    if (node.untried.length === 0) return null;
    const idx = Math.floor(Math.random() * node.untried.length);
    const mv = node.untried.splice(idx, 1)[0];
    const child = createRaveNode(mv.newBoard, opponent(node.color), node.board, node, { x: mv.x, y: mv.y });
    node.children.push(child);
    return child;
  }

  function uctRaveSearch(rootColor, settings) {
    const root = createRaveNode(board, rootColor, lastBoardSnapshot, null, null);
    root.untried = generateLegalMoves(root.board, root.color, root.lastSnap, settings.candidateLimit, true);
    if (root.untried.length === 0) return null;

    const startTime = performance.now();
    let iterations = 0;

    while (iterations < settings.iterations && (performance.now() - startTime) < settings.timeBudgetMs) {
      let node = root;
      const path = [node];

      // Selection: descend using UCT+RAVE blended value while fully expanded
      while (node.untried !== null && node.untried.length === 0 && node.children.length > 0) {
        node = uctRaveSelectChild(node, settings.explorationConst, settings.raveEquivParam);
        path.push(node);
      }

      // Expansion
      if (node.untried === null || node.untried.length > 0) {
        const child = expandRaveNode(node, settings.candidateLimit);
        if (child) { node = child; path.push(node); }
      }

      // Simulation with move logging for AMAF updates
      const { result: rawResult, moveLog } = policyBiasedPlayoutWithLog(node.board, opponent(node.color), settings.maxPlyPerPlayout);
      const scoreForRoot = rootColor === BLACK ? rawResult : -rawResult;
      const winForRoot = scoreForRoot > 0 ? 1 : (scoreForRoot < 0 ? 0 : 0.5);

      // Standard backpropagation up the visited path
      for (const n of path) {
        n.visits += 1;
        const winForThisNode = (n.color === rootColor) ? (1 - winForRoot) : winForRoot;
        n.winValue += winForThisNode;
      }

      // RAVE / AMAF backpropagation: collect all moves made by each color, both from the tree
      // path (beyond each ancestor) and from the playout tail, then update every ancestor's AMAF
      // tables for its mover color. A move played anywhere in this simulation "counts as if" it
      // had been tried directly from every earlier node where it was a legal, same-color option.
      const movesByColor = { [BLACK]: [], [WHITE]: [] };
      for (let i = 1; i < path.length; i++) {
        movesByColor[path[i - 1].color].push(path[i].move);
      }
      for (const m of moveLog) {
        movesByColor[m.color].push({ x: m.x, y: m.y });
      }

      for (let i = 0; i < path.length - 1; i++) {
        const ancestor = path[i];
        const moverColor = ancestor.color;
        const winForMover = (moverColor === rootColor) ? winForRoot : (1 - winForRoot);
        for (const mv of movesByColor[moverColor]) {
          const key = moveKey(mv.x, mv.y);
          ancestor.amafVisits.set(key, (ancestor.amafVisits.get(key) || 0) + 1);
          ancestor.amafWins.set(key, (ancestor.amafWins.get(key) || 0) + winForMover);
        }
      }

      iterations++;
    }

    if (root.children.length === 0) return null;
    let best = root.children[0];
    for (const child of root.children) {
      if (child.visits > best.visits) best = child;
    }
    return { move: best.move, iterations };
  }

  function runAiMove() {
    if (gameOver) return;
    aiThinking = true;
    const level = aiLevelSelect.value;
    const settings = DIFFICULTY[level];
    const engineLabel = settings.engine === 'uct-rave' ? 'UCT+RAVE深搜' : '單層推演';
    thinkingEl.textContent = `AI思考中（難度：${aiLevelSelect.options[aiLevelSelect.selectedIndex].text}，引擎：${engineLabel}）...`;

    setTimeout(() => {
      let move = null;
      if (settings.engine === 'uct-rave') {
        const result = uctRaveSearch(WHITE, settings);
        move = result ? result.move : null;
      } else {
        move = flatEngineSelectMove(WHITE, settings);
      }

      aiThinking = false;
      setButtonsEnabled(true);

      if (!move) {
        passCount++;
        thinkingEl.textContent = '';
        if (passCount >= 2) { endGame(); return; }
        current = BLACK;
        setStatus('AI選擇停一手（無有利落點）。請落子');
        return;
      }

      placeStone(move.x, move.y, WHITE);
      draw();
      current = BLACK;
      thinkingEl.textContent = '';
      setStatus(`AI於 (${move.x + 1}, ${move.y + 1}) 落子。請落子`);
    }, 30);
  }

  /**
   * Self-test suite: verifies the rule engine's trickiest legality cases on isolated small boards.
   */
  function runSelfTests() {
    const results = [];

    (function () {
      const s = 5;
      const b = Array.from({ length: s }, () => Array(s).fill(EMPTY));
      b[1][2] = WHITE;
      b[1][1] = BLACK; b[1][3] = BLACK; b[0][2] = BLACK;
      b[3][2] = WHITE; b[3][3] = EMPTY;
      b[2][1] = WHITE; b[2][0] = EMPTY;
      b[2][3] = WHITE; b[2][4] = EMPTY;
      const r = attemptMoveOnBoard(b, 2, 2, BLACK, null, s);
      const pass = r !== null && r.capturedCount === 1 && r.newBoard[1][2] === EMPTY;
      results.push({ name: '叫吃：吃子後於原本四面被圍的點落子應為合法', pass });
    })();

    (function () {
      const s = 5;
      const b = Array.from({ length: s }, () => Array(s).fill(EMPTY));
      b[1][2] = WHITE; b[1][1] = EMPTY;
      b[3][2] = WHITE; b[3][3] = EMPTY;
      b[2][1] = WHITE; b[2][0] = EMPTY;
      b[2][3] = WHITE; b[2][4] = EMPTY;
      const r = attemptMoveOnBoard(b, 2, 2, BLACK, null, s);
      results.push({ name: '真自殺：無法吃子且自身無氣應為非法', pass: r === null });
    })();

    (function () {
      const s = 5;
      const beforeWhiteCapture = Array.from({ length: s }, () => Array(s).fill(EMPTY));
      beforeWhiteCapture[1][2] = BLACK;
      beforeWhiteCapture[3][2] = BLACK;
      beforeWhiteCapture[2][1] = BLACK;
      beforeWhiteCapture[2][2] = WHITE;
      beforeWhiteCapture[2][3] = EMPTY;
      const prevSnapshot = cloneBoard(beforeWhiteCapture);
      const currentBoard = Array.from({ length: s }, () => Array(s).fill(EMPTY));
      currentBoard[1][2] = BLACK;
      currentBoard[3][2] = BLACK;
      currentBoard[2][1] = BLACK;
      currentBoard[2][3] = WHITE;
      currentBoard[2][2] = EMPTY;
      const r = attemptMoveOnBoard(currentBoard, 2, 2, BLACK, prevSnapshot, s);
      results.push({ name: '打劫：單子立即回提造成同型應為非法', pass: r === null });
    })();

    return results;
  }

  function displaySelfTestResults(results) {
    const allPass = results.every(r => r.pass);
    const lines = results.map(r => `${r.pass ? '✓' : '✗'} ${r.name}`);
    selfTestEl.textContent = '規則引擎自檢：\n' + lines.join('\n');
    selfTestEl.className = allPass ? '' : 'failed';
    if (!allPass) console.error('Go rule engine self-test FAILED:', results);
    else console.log('Go rule engine self-test passed:', results);
  }

  displaySelfTestResults(runSelfTests());
  initBoard(9);
})();
</script>
