<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圍棋 - KataLite HTML AI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 18px;
    background: #1e2329;
    color: #edf2f7;
    font-family: "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin: 4px 0 12px; font-size: 21px; }
  #panel {
    max-width: 980px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin-bottom: 10px;
  }
  label { font-size: 14px; color: #d6dde8; }
  select, button {
    border: 1px solid #596372;
    border-radius: 7px;
    background: #303943;
    color: #f4f7fb;
    padding: 8px 10px;
    font: inherit;
    font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: #3c4854; }
  button:disabled { cursor: not-allowed; opacity: .48; }
  #difficultyDesc, #status, #thinking, #ruleNote, #selfTestResult {
    max-width: 760px;
    text-align: center;
  }
  #difficultyDesc { min-height: 19px; color: #b8c5d6; font-size: 13px; }
  #boardWrap { position: relative; margin-top: 10px; }
  canvas {
    display: block;
    max-width: calc(100vw - 32px);
    height: auto;
    border: 2px solid #6f4c18;
    border-radius: 5px;
    background: #d9aa55;
    cursor: crosshair;
    box-shadow: 0 8px 25px rgba(0,0,0,.35);
  }
  #status { min-height: 24px; margin-top: 11px; font-size: 15px; }
  #thinking { min-height: 19px; color: #86bff6; font-size: 13px; }
  #scoreBoard { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 14px; }
  .dot { display:inline-block; width:12px; height:12px; margin-right:5px; border-radius:50%; vertical-align:-1px; }
  .black { background:#080b0f; border:1px solid #6c7178; }
  .white { background:#f9fbff; border:1px solid #aeb8c5; }
  #ruleNote { margin-top: 6px; font-size: 12px; color: #9ba9b8; line-height: 1.45; }
  #selfTestResult { margin-top: 8px; white-space: pre-line; color: #7bd98c; font-size: 11px; line-height: 1.45; }
  #selfTestResult.failed { color: #ff7c7c; }
  @media (max-width: 520px) {
    body { padding: 10px; }
    h1 { font-size: 18px; }
    #panel { gap: 6px; }
    select, button { padding: 7px 8px; font-size: 13px; }
  }
</style>
</head>
<body>
<h1>圍棋對弈：玩家（黑）vs HTML KataLite AI（白）</h1>

<div id="panel">
  <label>棋盤
    <select id="boardSize">
      <option value="9" selected>9 路</option>
      <option value="13">13 路</option>
      <option value="19">19 路</option>
    </select>
  </label>
  <label>AI 難度
    <select id="aiLevel">
      <option value="beginner">新手</option>
      <option value="easy">簡單</option>
      <option value="normal">普通</option>
      <option value="hard">較強</option>
      <option value="expert">專家</option>
      <option value="master">大師（UCT + RAVE）</option>
      <option value="katalite" selected>KataLite（HTML 強化）</option>
    </select>
  </label>
  <label>規則
    <select id="scoringRule">
      <option value="chinese" selected>中國數子法</option>
      <option value="japanese">日本目數法</option>
    </select>
  </label>
  <button id="newGameBtn">開新局</button>
  <button id="passBtn">停一手</button>
  <button id="undoBtn">悔棋</button>
</div>

<div id="difficultyDesc"></div>
<div id="boardWrap"><canvas id="board"></canvas></div>
<div id="status">請落子（黑棋先行）</div>
<div id="thinking"></div>
<div id="scoreBoard">
  <span><span class="dot black"></span>黑（玩家）提子：<span id="blackCaptures">0</span></span>
  <span><span class="dot white"></span>白（AI）提子：<span id="whiteCaptures">0</span></span>
</div>
<div id="ruleNote">KataLite 是純 HTML/JavaScript 的 KataGo-inspired AI：使用戰術先驗、影響力評估、PUCT + RAVE 與策略導向推演。它不是 KataGo 神經網絡；9 路棋盤效果最佳。合法性判斷會先提掉無氣的對方棋群，再檢查自身氣，因此「叫吃後在原本看似禁著點落子」正確視為合法。</div>
<div id="selfTestResult"></div>

<script>
(() => {
  'use strict';

  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const KOMI = 6.5;

  let size = 9;
  let cell = 42;
  let margin = 42;
  let board = [];
  let current = BLACK;
  let captures = { [BLACK]: 0, [WHITE]: 0 };
  let history = [];
  let lastBoardSnapshot = null;
  let passCount = 0;
  let gameOver = false;
  let aiThinking = false;
  let lastMove = null;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardSizeSelect = document.getElementById('boardSize');
  const aiLevelSelect = document.getElementById('aiLevel');
  const scoringRuleSelect = document.getElementById('scoringRule');
  const newGameBtn = document.getElementById('newGameBtn');
  const passBtn = document.getElementById('passBtn');
  const undoBtn = document.getElementById('undoBtn');
  const statusEl = document.getElementById('status');
  const thinkingEl = document.getElementById('thinking');
  const difficultyDescEl = document.getElementById('difficultyDesc');
  const blackCapturesEl = document.getElementById('blackCaptures');
  const whiteCapturesEl = document.getElementById('whiteCaptures');
  const selfTestEl = document.getElementById('selfTestResult');

  const DIFFICULTY = {
    beginner: {
      engine: 'flat', candidateLimit: 6, totalSims: 18, maxPly: 20, temperature: 45, blindSpotRate: 0.35,
      desc: '新手：常漏看叫吃與逃跑機會，落點隨機性高。'
    },
    easy: {
      engine: 'flat', candidateLimit: 8, totalSims: 40, maxPly: 28, temperature: 24, blindSpotRate: 0.16,
      desc: '簡單：有基本吃子及救棋概念，但仍會出現明顯失誤。'
    },
    normal: {
      engine: 'flat', candidateLimit: 12, totalSims: 85, maxPly: 38, temperature: 9, blindSpotRate: 0.05,
      desc: '普通：大致穩健，會看到基本戰術，但全局判斷有限。'
    },
    hard: {
      engine: 'flat', candidateLimit: 16, totalSims: 150, maxPly: 48, temperature: 2.5, blindSpotRate: 0,
      desc: '較強：較少漏看直接戰術，更多候選手及推演。'
    },
    expert: {
      engine: 'flat', candidateLimit: 20, totalSims: 230, maxPly: 58, temperature: 0.4, blindSpotRate: 0,
      desc: '專家：單層候選評估配策略導向推演，思考較久。'
    },
    master: {
      engine: 'uct-rave', candidateLimit: 22, iterations: 420, timeBudgetMs: 2600, maxPly: 36,
      explorationConst: 1.0, raveEquivParam: 260,
      desc: '大師：UCT 樹搜尋加 RAVE（AMAF）統計；比單層推演更會集中搜索。'
    },
    katalite: {
      engine: 'katalite', candidateLimit: 28, iterations: 650, timeBudgetMs: 1800, maxPly: 34,
      cpuct: 1.35, raveEquivParam: 220,
      desc: 'KataLite：戰術 policy prior、影響力／棋群價值估算、PUCT + RAVE 及戰術導向推演；9 路最佳。'
    }
  };

  function setStatus(text) { statusEl.textContent = text; }
  function moveKey(x, y) { return `${x},${y}`; }
  function cloneBoard(b) { return b.map(row => row.slice()); }
  function opponent(color) { return color === BLACK ? WHITE : BLACK; }
  function inBounds(x, y) { return x >= 0 && x < size && y >= 0 && y < size; }

  function neighbors(x, y) {
    const result = [];
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (inBounds(nx, ny)) result.push([nx, ny]);
    }
    return result;
  }

  function diagonalNeighbors(x, y) {
    const result = [];
    for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      const nx = x + dx, ny = y + dy;
      if (inBounds(nx, ny)) result.push([nx, ny]);
    }
    return result;
  }

  function boardsEqual(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let y = 0; y < a.length; y++) {
      for (let x = 0; x < a.length; x++) {
        if (a[y][x] !== b[y][x]) return false;
      }
    }
    return true;
  }

  function getGroup(b, x, y) {
    const color = b[y][x];
    const stones = new Set();
    const liberties = new Set();
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      const key = moveKey(cx, cy);
      if (stones.has(key)) continue;
      stones.add(key);
      for (const [nx, ny] of neighbors(cx, cy)) {
        if (b[ny][nx] === EMPTY) liberties.add(moveKey(nx, ny));
        else if (b[ny][nx] === color && !stones.has(moveKey(nx, ny))) stack.push([nx, ny]);
      }
    }
    return { stones, liberties };
  }

  /*
    Correct Go legality order:
    1. Place on a trial board.
    2. Remove ALL opponent groups now having no liberties.
    3. Check own liberties only after captures.
    Therefore a move that appears surrounded is legal when it captures a neighboring
    opponent group and the captured point becomes a liberty. Only actual self-capture
    with no resulting liberty is rejected.
  */
  function attemptMove(b, x, y, color, prevSnapshot) {
    if (!inBounds(x, y) || b[y][x] !== EMPTY) return null;
    const trial = cloneBoard(b);
    trial[y][x] = color;
    const enemy = opponent(color);
    const removed = new Set();

    for (const [nx, ny] of neighbors(x, y)) {
      if (trial[ny][nx] !== enemy) continue;
      const group = getGroup(trial, nx, ny);
      if (group.liberties.size === 0) {
        for (const stoneKey of group.stones) {
          const [sx, sy] = stoneKey.split(',').map(Number);
          trial[sy][sx] = EMPTY;
          removed.add(stoneKey);
        }
      }
    }

    const ownGroup = getGroup(trial, x, y);
    if (ownGroup.liberties.size === 0) return null;

    // Simple ko: cannot immediately recreate board before opponent's last move.
    if (removed.size === 1 && prevSnapshot && boardsEqual(trial, prevSnapshot)) return null;

    return { newBoard: trial, capturedCount: removed.size };
  }

  function isTrueEye(b, x, y, color) {
    if (b[y][x] !== EMPTY) return false;
    for (const [nx, ny] of neighbors(x, y)) {
      if (b[ny][nx] !== color) return false;
    }
    const diagonals = diagonalNeighbors(x, y);
    let ownDiag = 0;
    for (const [dx, dy] of diagonals) if (b[dy][dx] === color) ownDiag++;
    return diagonals.length === 4 ? ownDiag >= 3 : ownDiag === diagonals.length;
  }

  function placeStone(x, y, color) {
    const result = attemptMove(board, x, y, color, lastBoardSnapshot);
    if (!result) return false;
    history.push({
      board: cloneBoard(board),
      current,
      captures: { ...captures },
      lastBoardSnapshot: lastBoardSnapshot ? cloneBoard(lastBoardSnapshot) : null,
      passCount,
      lastMove: lastMove ? { ...lastMove } : null
    });
    lastBoardSnapshot = cloneBoard(board);
    board = result.newBoard;
    captures[color] += result.capturedCount;
    current = opponent(color);
    passCount = 0;
    lastMove = { color, x, y };
    updateScoreUi();
    return true;
  }

  function updateScoreUi() {
    blackCapturesEl.textContent = captures[BLACK];
    whiteCapturesEl.textContent = captures[WHITE];
  }

  function getStarPoints(n) {
    if (n === 9) return [[2,2],[6,2],[2,6],[6,6],[4,4]];
    if (n === 13) return [[3,3],[9,3],[3,9],[9,9],[6,6]];
    if (n === 19) return [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]];
    return [];
  }

  function drawStone(x, y, color) {
    const cx = margin + x * cell;
    const cy = margin + y * cell;
    const r = cell * 0.43;
    const gradient = ctx.createRadialGradient(cx - r * .35, cy - r * .35, r * .08, cx, cy, r);
    if (color === BLACK) {
      gradient.addColorStop(0, '#555c65');
      gradient.addColorStop(.35, '#20262d');
      gradient.addColorStop(1, '#020304');
    } else {
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(.7, '#e0e4e7');
      gradient.addColorStop(1, '#afb5bc');
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.strokeStyle = color === BLACK ? '#000' : '#929aa3';
    ctx.lineWidth = .7;
    ctx.stroke();
  }

  function drawLastMoveMarker() {
    if (!lastMove) return;
    const cx = margin + lastMove.x * cell;
    const cy = margin + lastMove.y * cell;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(3, cell * .095), 0, Math.PI * 2);
    ctx.fillStyle = lastMove.color === BLACK ? '#f7f3b7' : '#263238';
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#d9aa55';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#4f3511';
    ctx.lineWidth = 1;
    const max = margin + cell * (size - 1);
    for (let i = 0; i < size; i++) {
      const p = margin + i * cell;
      ctx.beginPath(); ctx.moveTo(margin, p); ctx.lineTo(max, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, margin); ctx.lineTo(p, max); ctx.stroke();
    }
    ctx.fillStyle = '#4f3511';
    for (const [x, y] of getStarPoints(size)) {
      ctx.beginPath();
      ctx.arc(margin + x * cell, margin + y * cell, Math.max(2.5, cell * .07), 0, Math.PI * 2);
      ctx.fill();
    }
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (board[y][x] !== EMPTY) drawStone(x, y, board[y][x]);
      }
    }
    drawLastMoveMarker();
  }

  function pixelToCoord(px, py) {
    return {
      x: Math.round((px - margin) / cell),
      y: Math.round((py - margin) / cell)
    };
  }

  function updateDifficultyDescription() {
    difficultyDescEl.textContent = DIFFICULTY[aiLevelSelect.value].desc;
  }

  function setControlLock(locked) {
    passBtn.disabled = locked;
    undoBtn.disabled = locked;
    boardSizeSelect.disabled = locked;
    aiLevelSelect.disabled = locked;
    scoringRuleSelect.disabled = locked;
  }

  function initGame(newSize) {
    size = newSize;
    cell = size === 19 ? 29 : size === 13 ? 35 : 42;
    margin = cell;
    const dimension = margin * 2 + cell * (size - 1);
    canvas.width = dimension;
    canvas.height = dimension;
    board = Array.from({ length: size }, () => Array(size).fill(EMPTY));
    current = BLACK;
    captures = { [BLACK]: 0, [WHITE]: 0 };
    history = [];
    lastBoardSnapshot = null;
    passCount = 0;
    gameOver = false;
    aiThinking = false;
    lastMove = null;
    setControlLock(false);
    updateScoreUi();
    updateDifficultyDescription();
    thinkingEl.textContent = '';
    setStatus('請落子（黑棋先行）');
    draw();
  }

  function floodEmptyRegions(b) {
    const visited = Array.from({ length: size }, () => Array(size).fill(false));
    const output = [];
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (b[y][x] !== EMPTY || visited[y][x]) continue;
        const region = [];
        const borders = new Set();
        const stack = [[x, y]];
        visited[y][x] = true;
        while (stack.length) {
          const [cx, cy] = stack.pop();
          region.push([cx, cy]);
          for (const [nx, ny] of neighbors(cx, cy)) {
            if (b[ny][nx] === EMPTY && !visited[ny][nx]) {
              visited[ny][nx] = true;
              stack.push([nx, ny]);
            } else if (b[ny][nx] !== EMPTY) {
              borders.add(b[ny][nx]);
            }
          }
        }
        output.push({ region, borders });
      }
    }
    return output;
  }

  function computeScore() {
    let blackTerritory = 0, whiteTerritory = 0;
    for (const item of floodEmptyRegions(board)) {
      if (item.borders.size !== 1) continue;
      if (item.borders.has(BLACK)) blackTerritory += item.region.length;
      if (item.borders.has(WHITE)) whiteTerritory += item.region.length;
    }
    let black = 0, white = 0;
    if (scoringRuleSelect.value === 'chinese') {
      let blackStones = 0, whiteStones = 0;
      for (const row of board) for (const stone of row) {
        if (stone === BLACK) blackStones++;
        if (stone === WHITE) whiteStones++;
      }
      black = blackStones + blackTerritory;
      white = whiteStones + whiteTerritory + KOMI;
    } else {
      black = blackTerritory + captures[BLACK];
      white = whiteTerritory + captures[WHITE] + KOMI;
    }
    return { black, white, winner: black > white ? '黑棋（玩家）' : '白棋（AI）' };
  }

  function endGame() {
    gameOver = true;
    setControlLock(true);
    const score = computeScore();
    const ruleLabel = scoringRuleSelect.value === 'chinese' ? '中國數子法' : '日本目數法';
    setStatus(`對局結束（${ruleLabel}）：黑 ${score.black.toFixed(1)}，白 ${score.white.toFixed(1)}。勝者：${score.winner}`);
  }

  // ---------- Shared tactical / rollout helpers ----------
  function groupId(group) { return [...group.stones].sort().join('|'); }

  function adjacentDistinctGroups(b, x, y, color) {
    const groups = new Set();
    for (const [nx, ny] of neighbors(x, y)) {
      if (b[ny][nx] === color) groups.add(groupId(getGroup(b, nx, ny)));
    }
    return groups.size;
  }

  function localInfluence(b, x, y, color) {
    let value = 0;
    const enemy = opponent(color);
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const nx = x + dx, ny = y + dy;
        const distance = Math.abs(dx) + Math.abs(dy);
        if (!inBounds(nx, ny) || distance === 0 || distance > 3) continue;
        const weight = 1 / distance;
        if (b[ny][nx] === color) value += weight;
        if (b[ny][nx] === enemy) value -= weight;
      }
    }
    return value;
  }

  function tacticalMoveScore(b, x, y, color, result) {
    const after = result.newBoard;
    const enemy = opponent(color);
    let score = result.capturedCount * 500;
    const ownAfter = getGroup(after, x, y);
    if (ownAfter.liberties.size === 1 && result.capturedCount === 0) score -= 350;
    else if (ownAfter.liberties.size === 2) score -= 25;
    else if (ownAfter.liberties.size >= 4) score += 12;

    const seenFriendly = new Set();
    for (const [nx, ny] of neighbors(x, y)) {
      if (b[ny][nx] !== color) continue;
      const group = getGroup(b, nx, ny);
      const id = groupId(group);
      if (!seenFriendly.has(id) && group.liberties.size === 1) {
        seenFriendly.add(id);
        score += 180 + group.stones.size * 15;
      }
    }

    const seenEnemy = new Set();
    for (const [nx, ny] of neighbors(x, y)) {
      if (after[ny][nx] !== enemy) continue;
      const group = getGroup(after, nx, ny);
      const id = groupId(group);
      if (!seenEnemy.has(id) && group.liberties.size === 1) {
        seenEnemy.add(id);
        score += 110 + group.stones.size * 9;
      }
    }

    const connects = adjacentDistinctGroups(b, x, y, color);
    if (connects >= 2) score += 55 * (connects - 1);
    const cuts = adjacentDistinctGroups(b, x, y, enemy);
    if (cuts >= 2) score += 28 * (cuts - 1);
    score += localInfluence(b, x, y, color) * 4;

    const edgeDistance = Math.min(x, y, size - 1 - x, size - 1 - y);
    if (edgeDistance === 0) score -= 14;
    else if (edgeDistance === 1) score += 4;
    else if (edgeDistance === 2 || edgeDistance === 3) score += 10;

    if (lastMove && lastMove.color === enemy) {
      const d = Math.abs(x - lastMove.x) + Math.abs(y - lastMove.y);
      if (d === 1) score += 16;
      else if (d === 2) score += 6;
    }
    return score;
  }

  function kataLiteCandidates(b, color, prevSnapshot, limit) {
    const candidates = [];
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (isTrueEye(b, x, y, color)) continue;
        const result = attemptMove(b, x, y, color, prevSnapshot);
        if (!result) continue;
        candidates.push({
          x, y,
          newBoard: result.newBoard,
          capturedCount: result.capturedCount,
          rawScore: tacticalMoveScore(b, x, y, color, result),
          prior: 0
        });
      }
    }
    candidates.sort((a, b2) => b2.rawScore - a.rawScore);
    const chosen = candidates.slice(0, Math.min(limit, candidates.length));
    if (!chosen.length) return chosen;
    const maxScore = chosen[0].rawScore;
    const temperature = 70;
    let total = 0;
    for (const c of chosen) {
      c.prior = Math.exp((c.rawScore - maxScore) / temperature);
      total += c.prior;
    }
    for (const c of chosen) c.prior /= total || 1;
    return chosen;
  }

  function chooseTacticalRolloutMove(b, color, prevSnapshot, candidateLimit = 12) {
    const candidates = kataLiteCandidates(b, color, prevSnapshot, candidateLimit);
    if (!candidates.length) return null;
    const tactical = candidates.filter(c => c.capturedCount > 0 || c.rawScore >= 140);
    if (tactical.length && Math.random() < .82) {
      return tactical[Math.floor(Math.random() * Math.min(3, tactical.length))];
    }
    const top = candidates.slice(0, Math.min(6, candidates.length));
    return Math.random() < .52 ? top[0] : top[Math.floor(Math.random() * top.length)];
  }

  function computeInfluenceMap(b) {
    let influence = Array.from({ length: size }, () => Array(size).fill(0));
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      influence[y][x] = b[y][x] === BLACK ? 4 : b[y][x] === WHITE ? -4 : 0;
    }
    for (let pass = 0; pass < 4; pass++) {
      const next = influence.map(row => row.slice());
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (b[y][x] !== EMPTY) continue;
        const ns = neighbors(x, y);
        const average = ns.reduce((sum, [nx, ny]) => sum + influence[ny][nx], 0) / Math.max(1, ns.length);
        next[y][x] = Math.max(-4, Math.min(4, average));
      }
      influence = next;
    }
    return influence;
  }

  function evaluateKataLite(b) {
    const influence = computeInfluenceMap(b);
    let blackTerritory = 0, whiteTerritory = 0, blackInfluence = 0, whiteInfluence = 0;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (b[y][x] !== EMPTY) continue;
      const v = influence[y][x];
      if (v > 1) blackTerritory++;
      else if (v < -1) whiteTerritory++;
      if (v > 0) blackInfluence += v;
      else whiteInfluence -= v;
    }

    let blackGroupValue = 0, whiteGroupValue = 0, blackStones = 0, whiteStones = 0;
    const visited = new Set();
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const color = b[y][x];
      if (color === EMPTY) continue;
      if (color === BLACK) blackStones++; else whiteStones++;
      const key = moveKey(x, y);
      if (visited.has(key)) continue;
      const group = getGroup(b, x, y);
      for (const stoneKey of group.stones) visited.add(stoneKey);
      const liberties = group.liberties.size;
      const stones = group.stones.size;
      let value = Math.min(liberties, 6) * 1.2 + stones * .08;
      if (liberties === 1) value -= stones * 8.5;
      else if (liberties === 2) value -= stones * 1.6;
      if (color === BLACK) blackGroupValue += value; else whiteGroupValue += value;
    }
    const blackValue = blackTerritory + blackInfluence * .10 + blackGroupValue + blackStones * .08;
    const whiteValue = whiteTerritory + whiteInfluence * .10 + whiteGroupValue + whiteStones * .08 + KOMI;
    return blackValue - whiteValue;
  }

  function kataLitePlayout(startBoard, startColor, maxPly) {
    let b = startBoard;
    let color = startColor;
    let previous = null;
    let passes = 0;
    const moveLog = [];
    for (let ply = 0; ply < maxPly && passes < 2; ply++) {
      const move = chooseTacticalRolloutMove(b, color, previous);
      if (!move) {
        passes++;
      } else {
        passes = 0;
        previous = b;
        b = move.newBoard;
        moveLog.push({ color, x: move.x, y: move.y });
      }
      color = opponent(color);
    }
    return { rawScore: evaluateKataLite(b), moveLog };
  }

  // ---------- Flat engine ----------
  function softmaxPick(items, temperature) {
    if (!items.length) return null;
    if (temperature <= .05) return items.reduce((best, item) => item.value > best.value ? item : best, items[0]);
    const max = Math.max(...items.map(i => i.value));
    const weights = items.map(i => Math.exp((i.value - max) / temperature));
    let r = Math.random() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < items.length; i++) {
      r -= weights[i];
      if (r <= 0) return items[i];
    }
    return items.at(-1);
  }

  function flatEngineSelectMove(color, settings) {
    let candidates = kataLiteCandidates(board, color, lastBoardSnapshot, Math.max(settings.candidateLimit * 2, 16));
    if (!candidates.length) return null;
    if (Math.random() < settings.blindSpotRate) {
      const nonTactical = candidates.filter(c => c.capturedCount === 0 && c.rawScore < 140);
      if (nonTactical.length) candidates = nonTactical;
    }
    candidates = candidates.slice(0, settings.candidateLimit);
    const sims = Math.max(1, Math.floor(settings.totalSims / candidates.length));
    const enemy = opponent(color);
    const evaluated = candidates.map(c => {
      let total = 0;
      for (let i = 0; i < sims; i++) {
        const rollout = kataLitePlayout(c.newBoard, enemy, settings.maxPly);
        total += color === BLACK ? rollout.rawScore : -rollout.rawScore;
      }
      return { x: c.x, y: c.y, value: total / sims + c.rawScore * .045 };
    });
    return softmaxPick(evaluated, settings.temperature);
  }

  // ---------- Generic UCT + RAVE engine ----------
  function createNode(nodeBoard, color, snapshot, parent, move, prior = .001) {
    return {
      board: nodeBoard, color, snapshot, parent, move, prior,
      children: [], untried: null, visits: 0, winValue: 0,
      amafVisits: new Map(), amafWins: new Map()
    };
  }

  function updateRave(path, moveLog, rootColor, winForRoot) {
    const movesByColor = { [BLACK]: [], [WHITE]: [] };
    for (let i = 1; i < path.length; i++) movesByColor[path[i - 1].color].push(path[i].move);
    for (const m of moveLog) movesByColor[m.color].push({ x: m.x, y: m.y });
    for (let i = 0; i < path.length - 1; i++) {
      const ancestor = path[i];
      const winForMover = ancestor.color === rootColor ? winForRoot : 1 - winForRoot;
      for (const move of movesByColor[ancestor.color]) {
        const key = moveKey(move.x, move.y);
        ancestor.amafVisits.set(key, (ancestor.amafVisits.get(key) || 0) + 1);
        ancestor.amafWins.set(key, (ancestor.amafWins.get(key) || 0) + winForMover);
      }
    }
  }

  function selectUctRaveChild(node, settings, usePuct) {
    let best = null, bestValue = -Infinity;
    const beta = node.visits > 0 ? Math.sqrt(settings.raveEquivParam / (3 * node.visits + settings.raveEquivParam)) : 1;
    for (const child of node.children) {
      const key = moveKey(child.move.x, child.move.y);
      const qUct = child.visits ? child.winValue / child.visits : .5;
      const av = node.amafVisits.get(key) || 0;
      const aw = node.amafWins.get(key) || 0;
      const qRave = av ? aw / av : .5;
      const q = (1 - beta) * qUct + beta * qRave;
      const explore = usePuct
        ? settings.cpuct * child.prior * Math.sqrt(node.visits + 1) / (1 + child.visits)
        : settings.explorationConst * Math.sqrt(Math.log(node.visits + 1) / (child.visits + 1));
      const value = q + explore;
      if (value > bestValue) { bestValue = value; best = child; }
    }
    return best;
  }

  function expandNode(node, settings) {
    if (node.untried === null) node.untried = kataLiteCandidates(node.board, node.color, node.snapshot, settings.candidateLimit);
    if (!node.untried.length) return null;
    const index = Math.floor(Math.random() * Math.min(5, node.untried.length));
    const move = node.untried.splice(index, 1)[0];
    const child = createNode(move.newBoard, opponent(node.color), node.board, node, { x: move.x, y: move.y }, move.prior);
    node.children.push(child);
    return child;
  }

  function treeSearch(rootColor, settings, usePuct) {
    const root = createNode(board, rootColor, lastBoardSnapshot, null, null, 1);
    root.untried = kataLiteCandidates(root.board, root.color, root.snapshot, settings.candidateLimit);
    if (!root.untried.length) return null;
    const started = performance.now();
    let iterations = 0;
    while (iterations < settings.iterations && performance.now() - started < settings.timeBudgetMs) {
      let node = root;
      const path = [node];
      while (node.untried !== null && node.untried.length === 0 && node.children.length) {
        node = selectUctRaveChild(node, settings, usePuct);
        path.push(node);
      }
      if (node.untried === null || node.untried.length) {
        const child = expandNode(node, settings);
        if (child) { node = child; path.push(node); }
      }
      const playout = kataLitePlayout(node.board, opponent(node.color), settings.maxPly);
      const scoreForRoot = rootColor === BLACK ? playout.rawScore : -playout.rawScore;
      const winForRoot = scoreForRoot > .35 ? 1 : scoreForRoot < -.35 ? 0 : .5;
      for (const p of path) {
        p.visits++;
        p.winValue += p.color === rootColor ? winForRoot : 1 - winForRoot;
      }
      updateRave(path, playout.moveLog, rootColor, winForRoot);
      iterations++;
    }
    if (!root.children.length) return null;
    root.children.sort((a, b) => b.visits - a.visits || (b.winValue / Math.max(1,b.visits)) - (a.winValue / Math.max(1,a.visits)));
    const best = root.children[0];
    return { move: best.move, iterations, visits: best.visits, winrate: best.winValue / Math.max(1, best.visits) };
  }

  function uctRaveSearch(color, settings) { return treeSearch(color, settings, false); }
  function kataLiteSearch(color, settings) { return treeSearch(color, settings, true); }

  // ---------- AI turn ----------
  function runAiMove() {
    if (gameOver || current !== WHITE) return;
    aiThinking = true;
    setControlLock(true);
    const settings = DIFFICULTY[aiLevelSelect.value];
    const label = settings.engine === 'katalite' ? 'KataLite PUCT + RAVE' : settings.engine === 'uct-rave' ? 'UCT + RAVE' : '策略推演';
    thinkingEl.textContent = `AI 思考中（${label}）...`;

    setTimeout(() => {
      try {
        let result;
        if (settings.engine === 'katalite') result = kataLiteSearch(WHITE, settings);
        else if (settings.engine === 'uct-rave') result = uctRaveSearch(WHITE, settings);
        else result = flatEngineSelectMove(WHITE, settings);

        const move = result?.move ?? result;
        if (!move) {
          passCount++;
          current = BLACK;
          if (passCount >= 2) endGame();
          else setStatus('AI 停一手。請落子。');
          return;
        }
        if (!placeStone(move.x, move.y, WHITE)) throw new Error('AI returned illegal move');
        draw();
        const extra = result?.iterations ? `（搜索 ${result.iterations} 次）` : '';
        setStatus(`AI 於 (${move.x + 1}, ${move.y + 1}) 落子${extra}。請落子。`);
      } catch (error) {
        console.error(error);
        current = BLACK;
        setStatus(`AI 運算出錯：${error.message}`);
      } finally {
        aiThinking = false;
        thinkingEl.textContent = '';
        if (!gameOver) setControlLock(false);
      }
    }, 25);
  }

  // ---------- UI events ----------
  canvas.addEventListener('click', event => {
    if (gameOver || aiThinking || current !== BLACK) return;
    const rect = canvas.getBoundingClientRect();
    const px = (event.clientX - rect.left) * canvas.width / rect.width;
    const py = (event.clientY - rect.top) * canvas.height / rect.height;
    const { x, y } = pixelToCoord(px, py);
    if (!inBounds(x, y)) return;
    if (!placeStone(x, y, BLACK)) {
      setStatus('此點不能落子：已有棋子、違反打劫，或是不能吃子且自身無氣的自殺禁手。');
      return;
    }
    draw();
    setStatus('AI 思考中...');
    runAiMove();
  });

  newGameBtn.addEventListener('click', () => initGame(Number(boardSizeSelect.value)));
  aiLevelSelect.addEventListener('change', updateDifficultyDescription);

  passBtn.addEventListener('click', () => {
    if (gameOver || aiThinking || current !== BLACK) return;
    history.push({
      board: cloneBoard(board), current, captures: { ...captures },
      lastBoardSnapshot: lastBoardSnapshot ? cloneBoard(lastBoardSnapshot) : null,
      passCount, lastMove: lastMove ? { ...lastMove } : null
    });
    passCount++;
    current = WHITE;
    if (passCount >= 2) { endGame(); return; }
    setStatus('你停一手，AI 思考中...');
    runAiMove();
  });

  undoBtn.addEventListener('click', () => {
    if (aiThinking || history.length < 2) {
      if (!aiThinking) setStatus('暫時沒有足夠步數可悔棋。');
      return;
    }
    history.pop(); // discard state before AI's last move
    const state = history.pop(); // restore state before player's last move
    board = state.board;
    current = state.current;
    captures = state.captures;
    lastBoardSnapshot = state.lastBoardSnapshot;
    passCount = state.passCount;
    lastMove = state.lastMove;
    gameOver = false;
    updateScoreUi();
    draw();
    setStatus('已悔棋，請落子。');
  });

  // ---------- Small rule-engine test suite ----------
  function runSelfTests() {
    const originalSize = size;
    const results = [];
    // These tests require a 5x5 temporary board, so use a local version of the core test helper.
    function localNeighbors(x, y, s) {
      return [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy]) => [x+dx,y+dy]).filter(([nx,ny]) => nx >= 0 && nx < s && ny >= 0 && ny < s);
    }
    function localGroup(b, x, y, s) {
      const color = b[y][x], stones = new Set(), liberties = new Set(), stack = [[x,y]];
      while (stack.length) {
        const [cx,cy] = stack.pop(), k = `${cx},${cy}`;
        if (stones.has(k)) continue;
        stones.add(k);
        for (const [nx,ny] of localNeighbors(cx,cy,s)) {
          if (b[ny][nx] === EMPTY) liberties.add(`${nx},${ny}`);
          else if (b[ny][nx] === color && !stones.has(`${nx},${ny}`)) stack.push([nx,ny]);
        }
      }
      return { stones, liberties };
    }
    function localAttempt(b, x, y, color, previous, s) {
      if (b[y][x] !== EMPTY) return null;
      const t = b.map(r => r.slice()); t[y][x] = color;
      const removed = new Set();
      for (const [nx,ny] of localNeighbors(x,y,s)) if (t[ny][nx] === opponent(color)) {
        const g = localGroup(t,nx,ny,s);
        if (!g.liberties.size) for (const key of g.stones) { const [sx,sy] = key.split(',').map(Number); t[sy][sx] = EMPTY; removed.add(key); }
      }
      if (!localGroup(t,x,y,s).liberties.size) return null;
      if (removed.size === 1 && previous && boardsEqual(t, previous)) return null;
      return { newBoard:t, capturedCount:removed.size };
    }
    {
      const s=5, b=Array.from({length:s},()=>Array(s).fill(EMPTY));
      b[1][2]=WHITE; b[1][1]=BLACK; b[1][3]=BLACK; b[0][2]=BLACK;
      b[3][2]=WHITE; b[2][1]=WHITE; b[2][3]=WHITE;
      const r=localAttempt(b,2,2,BLACK,null,s);
      results.push({ name:'叫吃後在原本四面被圍點落子合法', pass: !!r && r.capturedCount===1 && r.newBoard[1][2]===EMPTY });
    }
    {
      const s=5, b=Array.from({length:s},()=>Array(s).fill(EMPTY));
      b[1][2]=WHITE; b[3][2]=WHITE; b[2][1]=WHITE; b[2][3]=WHITE;
      const r=localAttempt(b,2,2,BLACK,null,s);
      results.push({ name:'真自殺（不能吃子且無氣）非法', pass:r===null });
    }
    size = originalSize;
    return results;
  }

  function displaySelfTests() {
    const tests = runSelfTests();
    const ok = tests.every(t => t.pass);
    selfTestEl.textContent = '規則引擎自檢：\n' + tests.map(t => `${t.pass ? '✓' : '✗'} ${t.name}`).join('\n');
    selfTestEl.className = ok ? '' : 'failed';
  }

  displaySelfTests();
  initGame(9);
})();
</script>
