<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圍棋 KataLite</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #181c20;
    color: #eef2f5;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  #topbar, #bottombar, #replaybar {
    width: min(100%, 1120px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
    padding: 8px 10px;
  }
  #topbar { min-height: 48px; }
  #bottombar { min-height: 42px; padding-top: 4px; }
  #replaybar { width: min(100%, 720px); min-height: 42px; padding: 4px 8px 7px; }
  #replaybar[hidden] { display: none; }
  select, button {
    appearance: none;
    border: 1px solid #4d5660;
    border-radius: 7px;
    background: #283039;
    color: #eef2f5;
    min-height: 32px;
    padding: 5px 9px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { background: #35414c; }
  button:disabled { opacity: .42; cursor: default; }
  #boardWrap {
    width: min(96vw, calc(100vh - 112px), 1000px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border: 2px solid #6c4919;
    border-radius: 4px;
    background: #d9aa55;
    cursor: crosshair;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #info { min-width: 120px; text-align: center; color: #bac5d0; font-size: 13px; white-space: nowrap; }
  #message {
    width: min(96vw, 1000px);
    min-height: 22px;
    padding: 2px 12px 0;
    text-align: center;
    color: #c8d4df;
    font-size: 13px;
  }
  #message.score { color: #f6dfa5; font-weight: 600; }
  #replaySpeed { width: 110px; accent-color: #9bc6ee; }
  @media (max-width: 620px) {
    #topbar { gap: 5px; padding: 6px; }
    #bottombar { gap: 5px; padding: 2px 6px 6px; }
    select, button { min-height: 30px; padding: 4px 7px; font-size: 12px; }
    #boardWrap { width: min(99vw, calc(100vh - 128px)); }
  }
</style>
</head>
<body>

<div id="topbar">
  <select id="boardSize" aria-label="棋盤">
    <option value="9" selected>9路</option>
    <option value="13">13路</option>
    <option value="19">19路</option>
  </select>
  <select id="playerColor" aria-label="玩家棋色">
    <option value="black" selected>黑</option>
    <option value="white">白</option>
  </select>
  <button id="newGameBtn">新局</button>
  <button id="passBtn">停</button>
  <button id="undoBtn">悔</button>
  <button id="exportSgfBtn">SGF</button>
  <button id="replayBtn">覆盤</button>
</div>

<div id="boardWrap"><canvas id="board"></canvas></div>
<div id="message"></div>
<div id="bottombar"><span id="info"></span></div>

<div id="replaybar" hidden>
  <button id="replayFirstBtn">|&lt;</button>
  <button id="replayPrevBtn">&lt;</button>
  <button id="replayPlayBtn">▶</button>
  <button id="replayNextBtn">&gt;</button>
  <button id="replayLastBtn">&gt;|</button>
  <input id="replaySpeed" type="range" min="200" max="1800" step="100" value="800" aria-label="播放速度">
  <button id="exitReplayBtn">返回</button>
</div>

<script>
(() => {
  'use strict';

  const EMPTY = 0, BLACK = 1, WHITE = 2, KOMI = 6.5;
  const SGF_ALPHABET = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const KATALITE = { candidateLimit: 28, iterations: 650, timeBudgetMs: 1800, maxPly: 34, cpuct: 1.35, raveEquivParam: 220 };

  let size = 9, cell = 60, margin = 60;
  let board = [], current = BLACK, playerStone = BLACK, aiStone = WHITE;
  let captures = { [BLACK]: 0, [WHITE]: 0 };
  let history = [], moveHistory = [], lastBoardSnapshot = null, lastMove = null;
  let passCount = 0, gameOver = false, aiThinking = false;
  let replayMode = false, replayIndex = 0, replayBoard = [], replayLastMove = null, replayTimer = null;
  let savedLiveState = null;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardSizeSelect = document.getElementById('boardSize');
  const playerColorSelect = document.getElementById('playerColor');
  const newGameBtn = document.getElementById('newGameBtn');
  const passBtn = document.getElementById('passBtn');
  const undoBtn = document.getElementById('undoBtn');
  const exportSgfBtn = document.getElementById('exportSgfBtn');
  const replayBtn = document.getElementById('replayBtn');
  const infoEl = document.getElementById('info');
  const messageEl = document.getElementById('message');
  const replaybar = document.getElementById('replaybar');
  const replayFirstBtn = document.getElementById('replayFirstBtn');
  const replayPrevBtn = document.getElementById('replayPrevBtn');
  const replayPlayBtn = document.getElementById('replayPlayBtn');
  const replayNextBtn = document.getElementById('replayNextBtn');
  const replayLastBtn = document.getElementById('replayLastBtn');
  const replaySpeed = document.getElementById('replaySpeed');
  const exitReplayBtn = document.getElementById('exitReplayBtn');

  const key = (x, y) => `${x},${y}`;
  const cloneBoard = b => b.map(row => row.slice());
  const opponent = c => c === BLACK ? WHITE : BLACK;
  const inBounds = (x, y) => x >= 0 && x < size && y >= 0 && y < size;
  const emptyBoard = () => Array.from({ length: size }, () => Array(size).fill(EMPTY));
  const stoneName = c => c === BLACK ? '黑' : '白';
  function setMessage(text = '', score = false) { messageEl.textContent = text; messageEl.classList.toggle('score', score); }

  function neighbors(x, y) {
    const r = [];
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (inBounds(nx, ny)) r.push([nx, ny]);
    }
    return r;
  }

  function diagonals(x, y) {
    const r = [];
    for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      const nx = x + dx, ny = y + dy;
      if (inBounds(nx, ny)) r.push([nx, ny]);
    }
    return r;
  }

  function boardsEqual(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let y = 0; y < a.length; y++) for (let x = 0; x < a.length; x++) if (a[y][x] !== b[y][x]) return false;
    return true;
  }

  function getGroup(b, x, y) {
    const color = b[y][x], stones = new Set(), liberties = new Set(), stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop(), k = key(cx, cy);
      if (stones.has(k)) continue;
      stones.add(k);
      for (const [nx, ny] of neighbors(cx, cy)) {
        if (b[ny][nx] === EMPTY) liberties.add(key(nx, ny));
        else if (b[ny][nx] === color && !stones.has(key(nx, ny))) stack.push([nx, ny]);
      }
    }
    return { stones, liberties };
  }

  function attemptMove(b, x, y, color, previous) {
    if (!inBounds(x, y) || b[y][x] !== EMPTY) return null;
    const trial = cloneBoard(b), enemy = opponent(color), removed = new Set();
    trial[y][x] = color;
    for (const [nx, ny] of neighbors(x, y)) {
      if (trial[ny][nx] !== enemy) continue;
      const group = getGroup(trial, nx, ny);
      if (!group.liberties.size) {
        for (const point of group.stones) {
          const [sx, sy] = point.split(',').map(Number);
          trial[sy][sx] = EMPTY;
          removed.add(point);
        }
      }
    }
    if (!getGroup(trial, x, y).liberties.size) return null;
    if (removed.size === 1 && previous && boardsEqual(trial, previous)) return null;
    return { newBoard: trial, capturedCount: removed.size };
  }

  function isTrueEye(b, x, y, color) {
    if (b[y][x] !== EMPTY) return false;
    for (const [nx, ny] of neighbors(x, y)) if (b[ny][nx] !== color) return false;
    const ds = diagonals(x, y), own = ds.filter(([nx, ny]) => b[ny][nx] === color).length;
    return ds.length === 4 ? own >= 3 : own === ds.length;
  }

  function saveState() {
    history.push({
      board: cloneBoard(board), current, captures: { ...captures }, previous: lastBoardSnapshot ? cloneBoard(lastBoardSnapshot) : null,
      passCount, lastMove: lastMove ? { ...lastMove } : null, moveLength: moveHistory.length
    });
  }

  function placeStone(x, y, color) {
    const result = attemptMove(board, x, y, color, lastBoardSnapshot);
    if (!result) return false;
    saveState();
    lastBoardSnapshot = cloneBoard(board);
    board = result.newBoard;
    captures[color] += result.capturedCount;
    current = opponent(color);
    passCount = 0;
    lastMove = { color, x, y, pass: false };
    moveHistory.push({ color, x, y, pass: false });
    updateInfo();
    return true;
  }

  function pass(color) {
    saveState();
    moveHistory.push({ color, x: null, y: null, pass: true });
    current = opponent(color);
    passCount++;
    lastMove = { color, x: null, y: null, pass: true };
    setMessage(`${stoneName(color)}棋停一手`);
  }

  function getStars() {
    if (size === 9) return [[2,2],[6,2],[2,6],[6,6],[4,4]];
    if (size === 13) return [[3,3],[9,3],[3,9],[9,9],[6,6]];
    return [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]];
  }

  function drawStone(x, y, color) {
    const cx = margin + x * cell, cy = margin + y * cell, r = cell * .43;
    const g = ctx.createRadialGradient(cx-r*.35, cy-r*.35, r*.08, cx, cy, r);
    if (color === BLACK) { g.addColorStop(0, '#59616a'); g.addColorStop(.38, '#20262d'); g.addColorStop(1, '#010202'); }
    else { g.addColorStop(0, '#fff'); g.addColorStop(.72, '#e2e5e8'); g.addColorStop(1, '#adb4bb'); }
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = color === BLACK ? '#000' : '#8d959d'; ctx.lineWidth = .7; ctx.stroke();
  }

  function draw(renderBoard = board, marker = lastMove) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#d9aa55'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const max = margin + cell * (size - 1);
    ctx.strokeStyle = '#4d3410'; ctx.lineWidth = 1;
    for (let i = 0; i < size; i++) {
      const p = margin + i * cell;
      ctx.beginPath(); ctx.moveTo(margin, p); ctx.lineTo(max, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, margin); ctx.lineTo(p, max); ctx.stroke();
    }
    ctx.fillStyle = '#4d3410';
    for (const [x, y] of getStars()) { ctx.beginPath(); ctx.arc(margin+x*cell, margin+y*cell, Math.max(2.5, cell*.07), 0, Math.PI*2); ctx.fill(); }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (renderBoard[y][x] !== EMPTY) drawStone(x, y, renderBoard[y][x]);
    if (marker && !marker.pass) {
      ctx.beginPath(); ctx.arc(margin+marker.x*cell, margin+marker.y*cell, Math.max(3, cell*.09), 0, Math.PI*2);
      ctx.fillStyle = marker.color === BLACK ? '#f5efac' : '#27313a'; ctx.fill();
    }
  }

  function resizeBoard() {
    const wrap = document.getElementById('boardWrap');
    const pixels = Math.max(200, Math.floor(wrap.getBoundingClientRect().width));
    canvas.width = pixels; canvas.height = pixels;
    cell = pixels / (size + 1); margin = cell;
    draw(replayMode ? replayBoard : board, replayMode ? replayLastMove : lastMove);
  }

  function updateInfo(text = '') {
    if (text) { infoEl.textContent = text; return; }
    if (replayMode) { infoEl.textContent = `${replayIndex}/${moveHistory.length}`; return; }
    if (gameOver) { infoEl.textContent = '終局'; return; }
    if (aiThinking) { infoEl.textContent = '…'; return; }
    infoEl.textContent = `${stoneName(playerStone)} ${captures[BLACK]} : ${captures[WHITE]} ${stoneName(aiStone)}`;
  }

  function lockControls(locked) {
    boardSizeSelect.disabled = locked; playerColorSelect.disabled = locked;
    passBtn.disabled = locked; undoBtn.disabled = locked; exportSgfBtn.disabled = locked; replayBtn.disabled = locked;
  }

  function initGame() {
    stopReplay(); replayMode = false; replaybar.hidden = true;
    size = Number(boardSizeSelect.value);
    playerStone = playerColorSelect.value === 'black' ? BLACK : WHITE;
    aiStone = opponent(playerStone);
    board = emptyBoard(); current = BLACK; captures = { [BLACK]: 0, [WHITE]: 0 };
    history = []; moveHistory = []; lastBoardSnapshot = null; lastMove = null; passCount = 0; gameOver = false; aiThinking = false;
    setMessage(''); lockControls(false); resizeBoard(); updateInfo();
    if (playerStone === WHITE) setTimeout(runAiMove, 180);
  }

  // ---------- KataLite ----------
  const groupId = g => [...g.stones].sort().join('|');
  function adjacentGroups(b, x, y, color) { const s = new Set(); for (const [nx, ny] of neighbors(x, y)) if (b[ny][nx] === color) s.add(groupId(getGroup(b, nx, ny))); return s.size; }
  function localInfluence(b, x, y, color) {
    let v = 0, e = opponent(color);
    for (let dy=-3; dy<=3; dy++) for (let dx=-3; dx<=3; dx++) {
      const nx=x+dx, ny=y+dy, d=Math.abs(dx)+Math.abs(dy);
      if (!inBounds(nx,ny) || !d || d>3) continue;
      if (b[ny][nx] === color) v += 1/d; else if (b[ny][nx] === e) v -= 1/d;
    }
    return v;
  }
  function moveScore(b, x, y, color, r) {
    const after=r.newBoard, e=opponent(color); let score=r.capturedCount*500, own=getGroup(after,x,y);
    if (own.liberties.size===1 && !r.capturedCount) score-=350; else if (own.liberties.size===2) score-=25; else if (own.liberties.size>=4) score+=12;
    const sf=new Set(); for (const [nx,ny] of neighbors(x,y)) if (b[ny][nx]===color) { const g=getGroup(b,nx,ny),id=groupId(g); if(!sf.has(id)&&g.liberties.size===1){sf.add(id);score+=180+g.stones.size*15;} }
    const se=new Set(); for (const [nx,ny] of neighbors(x,y)) if (after[ny][nx]===e) { const g=getGroup(after,nx,ny),id=groupId(g); if(!se.has(id)&&g.liberties.size===1){se.add(id);score+=110+g.stones.size*9;} }
    const con=adjacentGroups(b,x,y,color), cut=adjacentGroups(b,x,y,e); if(con>=2)score+=55*(con-1); if(cut>=2)score+=28*(cut-1); score+=localInfluence(b,x,y,color)*4;
    const edge=Math.min(x,y,size-1-x,size-1-y); if(edge===0)score-=14; else if(edge===1)score+=4; else if(edge===2||edge===3)score+=10;
    return score;
  }
  function candidates(b, color, previous, limit) {
    const all=[];
    for(let y=0;y<size;y++) for(let x=0;x<size;x++) {
      if(isTrueEye(b,x,y,color))continue;
      const r=attemptMove(b,x,y,color,previous); if(r)all.push({x,y,newBoard:r.newBoard,capturedCount:r.capturedCount,raw:moveScore(b,x,y,color,r),prior:0});
    }
    all.sort((a,b)=>b.raw-a.raw); const out=all.slice(0,Math.min(limit,all.length)); if(!out.length)return out;
    const max=out[0].raw; let total=0; for(const m of out){m.prior=Math.exp((m.raw-max)/70);total+=m.prior;} for(const m of out)m.prior/=total||1;
    return out;
  }
  function rolloutMove(b,color,previous) {
    const c=candidates(b,color,previous,12); if(!c.length)return null;
    const t=c.filter(m=>m.capturedCount||m.raw>=140); if(t.length&&Math.random()<.82)return t[Math.floor(Math.random()*Math.min(3,t.length))];
    const top=c.slice(0,Math.min(6,c.length)); return Math.random()<.52?top[0]:top[Math.floor(Math.random()*top.length)];
  }
  function influence(b) {
    let a=Array.from({length:size},()=>Array(size).fill(0));
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)a[y][x]=b[y][x]===BLACK?4:b[y][x]===WHITE?-4:0;
    for(let p=0;p<4;p++){const n=a.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(b[y][x]===EMPTY){const ns=neighbors(x,y);n[y][x]=Math.max(-4,Math.min(4,ns.reduce((s,[nx,ny])=>s+a[ny][nx],0)/Math.max(1,ns.length)));}a=n;}
    return a;
  }
  function evaluate(b) {
    const inf=influence(b); let bt=0,wt=0,bi=0,wi=0;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(b[y][x]===EMPTY){const v=inf[y][x];if(v>1)bt++;else if(v<-1)wt++;if(v>0)bi+=v;else wi-=v;}
    let bg=0,wg=0,bs=0,ws=0; const seen=new Set();
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){const c=b[y][x];if(!c)continue;c===BLACK?bs++:ws++;if(seen.has(key(x,y)))continue;const g=getGroup(b,x,y);for(const z of g.stones)seen.add(z);let v=Math.min(g.liberties.size,6)*1.2+g.stones.size*.08;if(g.liberties.size===1)v-=g.stones.size*8.5;else if(g.liberties.size===2)v-=g.stones.size*1.6;c===BLACK?bg+=v:wg+=v;}
    return (bt+bi*.1+bg+bs*.08)-(wt+wi*.1+wg+ws*.08+KOMI);
  }
  function playout(start,startColor,maxPly) {
    let b=start,c=startColor,prev=null,passes=0; const log=[];
    for(let i=0;i<maxPly&&passes<2;i++){const m=rolloutMove(b,c,prev);if(!m)passes++;else{passes=0;prev=b;b=m.newBoard;log.push({color:c,x:m.x,y:m.y});}c=opponent(c);}
    return {score:evaluate(b),log};
  }

  function node(b,color,previous,parent,move,prior=.001){return{b,color,previous,parent,move,prior,children:[],untried:null,n:0,w:0,av:new Map(),aw:new Map()};}
  function updateRave(path,log,rootColor,win){const by={[BLACK]:[],[WHITE]:[]};for(let i=1;i<path.length;i++)by[path[i-1].color].push(path[i].move);for(const m of log)by[m.color].push({x:m.x,y:m.y});for(let i=0;i<path.length-1;i++){const a=path[i],value=a.color===rootColor?win:1-win;for(const m of by[a.color]){const k=key(m.x,m.y);a.av.set(k,(a.av.get(k)||0)+1);a.aw.set(k,(a.aw.get(k)||0)+value);}}}
  function selectChild(n,s){let best=null,bv=-Infinity;const beta=n.n?Math.sqrt(s.raveEquivParam/(3*n.n+s.raveEquivParam)):1;for(const c of n.children){const k=key(c.move.x,c.move.y),q1=c.n?c.w/c.n:.5,av=n.av.get(k)||0,q2=av?(n.aw.get(k)||0)/av:.5,q=(1-beta)*q1+beta*q2,u=s.cpuct*c.prior*Math.sqrt(n.n+1)/(1+c.n),v=q+u;if(v>bv){bv=v;best=c;}}return best;}
  function expand(n,s){if(n.untried===null)n.untried=candidates(n.b,n.color,n.previous,s.candidateLimit);if(!n.untried.length)return null;const m=n.untried.splice(Math.floor(Math.random()*Math.min(5,n.untried.length)),1)[0],c=node(m.newBoard,opponent(n.color),n.b,n,{x:m.x,y:m.y},m.prior);n.children.push(c);return c;}
  function search(rootColor,s){
    const root=node(board,rootColor,lastBoardSnapshot,null,null,1);root.untried=candidates(root.b,root.color,root.previous,s.candidateLimit);if(!root.untried.length)return null;const started=performance.now();let it=0;
    while(it<s.iterations&&performance.now()-started<s.timeBudgetMs){let n=root,path=[n];while(n.untried!==null&&!n.untried.length&&n.children.length){n=selectChild(n,s);path.push(n);}if(n.untried===null||n.untried.length){const c=expand(n,s);if(c){n=c;path.push(n);}}const r=playout(n.b,opponent(n.color),s.maxPly),score=rootColor===BLACK?r.score:-r.score,win=score>.35?1:score<-.35?0:.5;for(const p of path){p.n++;p.w+=p.color===rootColor?win:1-win;}updateRave(path,r.log,rootColor,win);it++;}
    if(!root.children.length)return null;root.children.sort((a,b)=>b.n-a.n||(b.w/Math.max(1,b.n))-(a.w/Math.max(1,a.n)));return{move:root.children[0].move,it};
  }

  function runAiMove(){
    if(gameOver||replayMode||current!==aiStone)return;
    aiThinking=true;lockControls(true);updateInfo();
    setTimeout(()=>{try{const r=search(aiStone,KATALITE),m=r?.move;if(!m){pass(aiStone);if(passCount>=2)endGame();else{lockControls(false);updateInfo();}return;}if(!placeStone(m.x,m.y,aiStone))throw Error('illegal');draw();}catch(e){console.error(e);current=playerStone;}finally{aiThinking=false;if(!gameOver)lockControls(false);updateInfo();}},25);
  }

  function scorePosition() {
    const seen = Array.from({ length: size }, () => Array(size).fill(false));
    let blackTerritory = 0, whiteTerritory = 0;
    for (let y=0;y<size;y++) for (let x=0;x<size;x++) {
      if (board[y][x] !== EMPTY || seen[y][x]) continue;
      const stack=[[x,y]], borders=new Set(), region=[]; seen[y][x]=true;
      while(stack.length){const [cx,cy]=stack.pop();region.push([cx,cy]);for(const[nx,ny]of neighbors(cx,cy)){if(board[ny][nx]===EMPTY&&!seen[ny][nx]){seen[ny][nx]=true;stack.push([nx,ny]);}else if(board[ny][nx]!==EMPTY)borders.add(board[ny][nx]);}}
      if(borders.size===1){if(borders.has(BLACK))blackTerritory+=region.length;else whiteTerritory+=region.length;}
    }
    let blackStones=0,whiteStones=0;
    for(const row of board)for(const stone of row){if(stone===BLACK)blackStones++;else if(stone===WHITE)whiteStones++;}
    const black=blackStones+blackTerritory;
    const white=whiteStones+whiteTerritory+KOMI;
    return { black, white, blackStones, whiteStones, blackTerritory, whiteTerritory, margin: Math.abs(black-white) };
  }

  function endGame(){
    gameOver=true;lockControls(true);exportSgfBtn.disabled=false;replayBtn.disabled=false;
    const score=scorePosition(), winner=score.black>score.white?'黑':'白';
    setMessage(`終局　黑 ${score.black.toFixed(1)}　白 ${score.white.toFixed(1)}　${winner}勝 ${score.margin.toFixed(1)}`,true);
    updateInfo('終局');
  }

  function sgfCoord(x,y){return x===null||y===null?'':SGF_ALPHABET[x]+SGF_ALPHABET[y];}
  function exportSgf(){
    const date=new Date().toISOString().slice(0,10),moves=moveHistory.map(m=>`;${m.color===BLACK?'B':'W'}[${sgfCoord(m.x,m.y)}]`).join('');
    const text=`(;GM[1]FF[4]CA[UTF-8]AP[KataLite:1.0]SZ[${size}]KM[${KOMI}]RU[Chinese]DT[${date}]PB[Player]PW[KataLite]${moves})`;
    const blob=new Blob([text],{type:'application/x-go-sgf;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`go-${size}-${date}.sgf`;a.click();URL.revokeObjectURL(url);
  }

  function stopReplay(){if(replayTimer){clearInterval(replayTimer);replayTimer=null;}replayPlayBtn.textContent='▶';}
  function rebuildReplay(index){
    replayBoard=emptyBoard();replayLastMove=null;let previous=null;
    for(let i=0;i<index;i++){const m=moveHistory[i];if(m.pass){replayLastMove={...m};continue;}const r=attemptMove(replayBoard,m.x,m.y,m.color,previous);if(!r)return;previous=cloneBoard(replayBoard);replayBoard=r.newBoard;replayLastMove={...m};}
    replayIndex=index;draw(replayBoard,replayLastMove);updateInfo();replayFirstBtn.disabled=index===0;replayPrevBtn.disabled=index===0;replayNextBtn.disabled=index===moveHistory.length;replayLastBtn.disabled=index===moveHistory.length;
  }
  function enterReplay(){if(aiThinking||!moveHistory.length)return;savedLiveState={board:cloneBoard(board),lastMove:lastMove?{...lastMove}:null,message:messageEl.textContent,messageScore:messageEl.classList.contains('score')};replayMode=true;lockControls(true);exportSgfBtn.disabled=false;exitReplayBtn.disabled=false;replaybar.hidden=false;setMessage('');rebuildReplay(0);}
  function exitReplay(){stopReplay();replayMode=false;replaybar.hidden=true;board=savedLiveState.board;lastMove=savedLiveState.lastMove;draw();setMessage(savedLiveState.message,savedLiveState.messageScore);if(!gameOver)lockControls(false);else{lockControls(true);exportSgfBtn.disabled=false;replayBtn.disabled=false;}updateInfo();}
  function autoplay(){if(replayTimer){stopReplay();return;}if(replayIndex>=moveHistory.length)rebuildReplay(0);replayPlayBtn.textContent='Ⅱ';replayTimer=setInterval(()=>{if(replayIndex>=moveHistory.length){stopReplay();return;}rebuildReplay(replayIndex+1);},Number(replaySpeed.value));}

  canvas.addEventListener('click',e=>{
    if(gameOver||aiThinking||replayMode||current!==playerStone)return;
    const r=canvas.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)*canvas.width/r.width-margin)/cell),y=Math.round(((e.clientY-r.top)*canvas.height/r.height-margin)/cell);
    if(!inBounds(x,y)||!placeStone(x,y,playerStone))return;
    setMessage('');draw();runAiMove();
  });
  newGameBtn.addEventListener('click',initGame);
  passBtn.addEventListener('click',()=>{if(gameOver||aiThinking||replayMode||current!==playerStone)return;pass(playerStone);if(passCount>=2)endGame();else runAiMove();});
  undoBtn.addEventListener('click',()=>{if(aiThinking||replayMode||history.length<2)return;history.pop();const s=history.pop();board=s.board;current=s.current;captures=s.captures;lastBoardSnapshot=s.previous;passCount=s.passCount;lastMove=s.lastMove;moveHistory=moveHistory.slice(0,s.moveLength);setMessage('');draw();updateInfo();});
  exportSgfBtn.addEventListener('click',exportSgf); replayBtn.addEventListener('click',enterReplay); exitReplayBtn.addEventListener('click',exitReplay);
  replayFirstBtn.addEventListener('click',()=>{stopReplay();rebuildReplay(0);}); replayPrevBtn.addEventListener('click',()=>{stopReplay();rebuildReplay(Math.max(0,replayIndex-1));}); replayNextBtn.addEventListener('click',()=>{stopReplay();rebuildReplay(Math.min(moveHistory.length,replayIndex+1));}); replayLastBtn.addEventListener('click',()=>{stopReplay();rebuildReplay(moveHistory.length);}); replayPlayBtn.addEventListener('click',autoplay); replaySpeed.addEventListener('input',()=>{if(replayTimer){stopReplay();autoplay();}});
  window.addEventListener('resize',()=>requestAnimationFrame(resizeBoard));

  initGame();
})();
</script>
</body>
</html>
