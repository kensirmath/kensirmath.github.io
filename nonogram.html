<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數織闖關｜玩家版</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;--bg:#fff;--text:#000;--panel:#fff;--border:#000;--cell:36px;color-scheme:light}
html[data-theme="dark"]{--bg:#161616;--text:#f5f5f5;--panel:#222;--border:#bbb;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:auto}h1{margin:0}p{line-height:1.5}.top,.controls,.tools,.metrics{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.controls,.tools,.metrics{margin:12px 0}label{display:grid;gap:4px}button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer}button.main{background:var(--text);color:var(--bg)}button:disabled{opacity:.55;cursor:wait}.card{border:1px solid var(--border);background:var(--panel);padding:14px;border-radius:10px;margin:14px 0}.metric{border:1px solid var(--border);border-radius:7px;padding:6px 9px}#message{min-height:24px;font-weight:600}.scroll{overflow:auto;padding:5px;max-width:100%}table{border-collapse:collapse;width:max-content;margin:0 auto;table-layout:fixed;user-select:none}th,td{border:1px solid #000;text-align:center;padding:0}th.corner{border:0}th.col{height:94px;width:var(--cell);vertical-align:bottom;padding-bottom:5px;line-height:1.15;font-size:12px;background:var(--panel);color:var(--text);border-color:var(--border)}th.row{height:var(--cell);min-width:94px;text-align:right;padding:0 7px;white-space:nowrap;font-size:12px;background:var(--panel);color:var(--text);border-color:var(--border)}td.cell{height:var(--cell);width:var(--cell);min-width:var(--cell);cursor:pointer;background:#fff;touch-action:none}td.cell.filled{background:#777}td.cell.mistake{outline:3px solid #d52222;outline-offset:-3px}td.cell.col5,th.col.col5{border-left-width:2px}td.cell.row5,th.row.row5{border-top-width:2px}.hint{font-size:13px}#win[hidden],#game[hidden]{display:none}#win{border:2px solid var(--border);padding:16px;border-radius:9px;margin:14px 0}#win h2{margin:0 0 5px}@media(max-width:600px){body{padding:10px}:root{--cell:31px}th.row{min-width:80px}th.col{height:85px}}
</style>
</head>
<body>
<main>
<div class="top"><h1>數織闖關</h1><button id="theme" type="button">🌙 黑夜模式</button></div>
<p>先選行數和欄數，再由淺入深逐題挑戰。只須塗灰正確格子，其餘保持白色。</p>
<section class="card">
<div class="controls">
<label for="height">行數（高）<select id="height"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option></select></label>
<label for="width">欄數（闊）<select id="width"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option></select></label>
<button id="start" class="main" type="button">開始新挑戰</button>
</div>
<div class="metrics"><span class="metric" id="score">累積分數：0</span><span class="metric" id="cleared">已完成：0 題</span><span class="metric" id="best">最高累積：0</span></div>
<p class="hint">行、欄各可選 2–15。更改尺寸後按「開始新挑戰」會重設今次闖關分數；歷史最高分保留。</p>
</section>
<section class="card" id="game" hidden>
<div class="metrics"><span class="metric" id="level"></span><span class="metric" id="clock">時間：00:00</span><span class="metric" id="progress"></span><span class="metric" id="points"></span></div>
<div class="tools"><button id="check" type="button">檢查</button><button id="reset" type="button">重填本題</button></div>
<div id="message" role="status" aria-live="polite"></div><div id="board" class="scroll"></div>
<p class="hint">點一下白格變灰，再點一下灰格還原白色；可以拖曳連續塗／擦。毋須填 ×：所有灰格位置正確時會自動完成。</p>
<div id="win" hidden><h2>🎉 恭喜，全部答啱！</h2><p id="result"></p><button id="next" class="main" type="button">下一題 →</button></div>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='nonogram-player-v1';
let state={score:0,cleared:0,best:0},h=0,w=0,answer=[],rows=[],cols=[],marks=[],drag=null,started=0,elapsed=0,timer=null,busy=false,won=false;
try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');state.best=Number.isFinite(s.best)?Math.max(0,Math.floor(s.best)):0}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({best:state.best}))}catch(e){}}
function runs(line){let a=[],n=0;for(const v of line){if(v)n++;else if(n){a.push(n);n=0}}if(n)a.push(n);return a.length?a:[0]}
function patterns(length,clue){if(clue.length===1&&clue[0]===0)return[0];let a=[];function place(i,at,mask){if(i===clue.length){a.push(mask);return}let min=clue.slice(i+1).reduce((x,y)=>x+y,0)+clue.length-i-1;for(let p=at;p+clue[i]+min<=length;p++)place(i+1,p+clue[i]+1,mask|(((1<<clue[i])-1)<<p))}place(0,0,0);return a}
function solve(rc,cc,maxNodes=85000){let height=rc.length,width=cc.length,rs=rc.map(x=>patterns(width,x)),cs=cc.map(x=>patterns(height,x)),count=0,nodes=0;function dfs(y,options){if(count>=2||nodes>=maxNodes)return;nodes++;if(y===height){count++;return}for(const row of rs[y]){let filtered=options.map((arr,x)=>arr.filter(mask=>Boolean(mask&(1<<y))===Boolean(row&(1<<x))));if(filtered.some(a=>!a.length))continue;dfs(y+1,filtered);if(count>=2||nodes>=maxNodes)break}}dfs(0,cs);return count===1&&nodes<maxNodes}
function trans(a){return a[0].map((_,x)=>a.map(row=>row[x]))}function blank(height,width){return Array.from({length:height},()=>Array(width).fill(0))}
function sample(height,width,level){let p=level===1?.39:level===2?.44:level===3?.47:.49,a=blank(height,width);if(level===1){if(Math.random()<.5){let y=Math.floor(Math.random()*height);for(let x=0;x<width;x++)if(Math.random()<.78)a[y][x]=1}else{let x=Math.floor(Math.random()*width);for(let y=0;y<height;y++)if(Math.random()<.78)a[y][x]=1}for(let y=0;y<height;y++)for(let x=0;x<width;x++)if(Math.random()<.09)a[y][x]=1;return a}for(let y=0;y<height;y++)for(let x=0;x<width;x++)a[y][x]=Math.random()<p?1:0;return a}
function fallback(height,width){let a=blank(height,width),y=Math.floor(height/2),x=Math.floor(width/2);for(let c=0;c<width;c++)a[y][c]=1;for(let r=0;r<height;r++)a[r][x]=1;return a}
function seconds(){return Math.max(0,Math.floor((performance.now()-started)/1000))}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function updateClock(){$('clock').textContent='時間：'+fmt(won?elapsed:seconds())}function stopClock(){if(timer)clearInterval(timer);timer=null}
function basePoints(){let tier=Math.min(5,Math.ceil((state.cleared+1)/3));return Math.round((h*w*(4+tier*2)+tier*30)/5)*5}
function ui(){let level=state.cleared+1,tier=Math.min(5,Math.ceil(level/3));$('score').textContent='累積分數：'+state.score;$('cleared').textContent='已完成：'+state.cleared+' 題';$('best').textContent='最高累積：'+state.best;$('level').textContent=`第 ${level} 題 · ${['','入門','初級','中級','進階','挑戰'][tier]} · ${h} × ${w}`;$('points').textContent=`本題基礎分：${basePoints()}`;$('progress').textContent=`已塗灰：${marks.flat().filter(Boolean).length}/${h*w}`}
function board(){let t=document.createElement('table'),header=document.createElement('tr'),corner=document.createElement('th');corner.className='corner';header.append(corner);for(let x=0;x<w;x++){let th=document.createElement('th');th.className='col'+(x&&x%5===0?' col5':'');th.innerHTML=cols[x].join('<br>');header.append(th)}t.append(header);for(let y=0;y<h;y++){let tr=document.createElement('tr'),th=document.createElement('th');th.className='row'+(y&&y%5===0?' row5':'');th.textContent=rows[y].join('  ');tr.append(th);for(let x=0;x<w;x++){let td=document.createElement('td');td.className='cell'+(x&&x%5===0?' col5':'')+(y&&y%5===0?' row5':'');td.dataset.y=y;td.dataset.x=x;td.setAttribute('aria-label',`第 ${y+1} 行第 ${x+1} 欄`);tr.append(td)}t.append(tr)}$('board').replaceChildren(t)}
async function newPuzzle(){if(busy)return;busy=true;won=false;stopClock();$('next').disabled=true;$('start').disabled=true;$('game').hidden=false;$('win').hidden=true;$('message').textContent='正在產生及驗證唯一解…';let found=null,level=state.cleared+1;await new Promise(r=>setTimeout(r,20));for(let i=0;i<130;i++){let a=sample(h,w,level),r=a.map(runs),c=trans(a).map(runs);if(solve(r,c,h*w>=180?38000:85000)){found=a;break}if(i%6===5)await new Promise(r=>setTimeout(r,0))}if(!found){let a=fallback(h,w);if(solve(a.map(runs),trans(a).map(runs),150000))found=a}if(!found){$('message').textContent='這次未能驗證題目，請再按「開始新挑戰」。';busy=false;$('start').disabled=false;return}answer=found;rows=answer.map(runs);cols=trans(answer).map(runs);marks=blank(h,w);board();ui();$('message').textContent='新題目開始！';started=performance.now();elapsed=0;updateClock();timer=setInterval(updateClock,250);busy=false;$('next').disabled=false;$('start').disabled=false}
function paint(cell,value){if(!cell||won||busy)return;let y=Number(cell.dataset.y),x=Number(cell.dataset.x);if(marks[y][x]===value)return;marks[y][x]=value;cell.classList.toggle('filled',value===1);cell.classList.remove('mistake');$('message').textContent='';$('progress').textContent=`已塗灰：${marks.flat().filter(Boolean).length}/${h*w}`;if(marks.every((row,r)=>row.every((v,c)=>v===answer[r][c])))finish()}
function finish(){if(won)return;elapsed=seconds();won=true;stopClock();updateClock();let base=basePoints(),bonus=Math.min(base,Math.max(0,Math.floor(base*(1-elapsed/(h*w*8+30))))),earned=base+bonus;state.score+=earned;state.cleared++;state.best=Math.max(state.best,state.score);save();$('score').textContent='累積分數：'+state.score;$('cleared').textContent='已完成：'+state.cleared+' 題';$('best').textContent='最高累積：'+state.best;$('message').textContent='所有灰格及白格都正確！';$('result').textContent=`用時 ${fmt(elapsed)} · 基礎分 ${base} + 時間獎勵 ${bonus} = +${earned} 分。現時累積 ${state.score} 分。`;$('win').hidden=false}
$('board').addEventListener('pointerdown',e=>{let cell=e.target.closest('td.cell');if(!cell||won||busy)return;e.preventDefault();let y=Number(cell.dataset.y),x=Number(cell.dataset.x);drag=e.button===2?0:1-marks[y][x];paint(cell,drag)});
$('board').addEventListener('pointerover',e=>{if(drag!==null&&e.buttons)paint(e.target.closest('td.cell'),drag)});document.addEventListener('pointerup',()=>drag=null);$('board').addEventListener('contextmenu',e=>e.preventDefault());
$('check').onclick=()=>{if(won||busy)return;let wrong=0;for(const cell of $('board').querySelectorAll('td.cell')){let y=Number(cell.dataset.y),x=Number(cell.dataset.x),fail=marks[y][x]!==answer[y][x];cell.classList.toggle('mistake',fail);if(fail)wrong++}if(wrong===0)finish();else $('message').textContent=`有 ${wrong} 格與答案不同，已用紅框標示。`};
$('reset').onclick=()=>{if(won||busy)return;marks=blank(h,w);board();ui();$('message').textContent='本題已清空；計時繼續。'};
$('next').onclick=()=>newPuzzle();$('start').onclick=()=>{if(busy)return;h=Number($('height').value);w=Number($('width').value);state.score=0;state.cleared=0;newPuzzle()};
$('best').textContent='最高累積：'+state.best;
function theme(v){document.documentElement.dataset.theme=v;$('theme').textContent=v==='dark'?'☀️ 日間模式':'🌙 黑夜模式';try{localStorage.setItem('nonogram-player-theme',v)}catch(e){}}$('theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');try{theme(localStorage.getItem('nonogram-player-theme')==='dark'?'dark':'light')}catch(e){theme('light')}
</script>
</body>
</html>
