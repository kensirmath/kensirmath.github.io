</style></head><body><main>
<div class="top"><h1>數織闖關</h1><button id="theme" type="button">🌙 黑夜模式</button></div>
<p>先選版面，再由淺入深逐題挑戰。題目由答案圖案產生，並經過唯一解檢查；通關後才累積分數。</p>
<section class="card"><div class="controls"><label>行數（高）<select id="height"></select></label><label>欄數（闊）<select id="width"></select></label><button id="start" class="main">開始新挑戰</button></div><div class="metrics"><span class="metric" id="score">累積分數：0</span><span class="metric" id="cleared">已完成：0 題</span><span class="metric" id="best">最高累積：0</span></div><p class="hint">選任何 2–15 行 × 2–15 欄，正方形及長方形都得。改尺寸後按「開始新挑戰」，會重設本次連續闖關，歷史最高分保留。</p></section>
<section class="card" id="game" hidden><div class="metrics"><span class="metric" id="level"></span><span class="metric" id="clock">時間：00:00</span><span class="metric" id="progress"></span><span class="metric" id="points"></span></div><div class="tools"><button class="active" id="fill">■ 塗灰</button><button id="white">× 留白</button><button id="erase">· 擦除</button><button id="check">檢查</button><button id="reset">重填本題</button></div><div id="message" role="status" aria-live="polite"></div><div id="board" class="scroll"></div><p class="hint">點擊／拖曳填格；右鍵快速標 ×。· 是未決定，必須將每格填成 ■ 或 × 才算完成。每題計時由出題開始；完成後暫停，下一題重新計時。</p><div id="win" hidden><h2>🎉 恭喜，全部答啱！</h2><p id="result"></p><button id="next" class="main">下一題 →</button></div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id),KEY='nonogram-player-v1';let state={score:0,cleared:0,best:0},h=0,w=0,answer=[],rows=[],cols=[],marks=[],mode=1,drag=null,started=0,elapsed=0,timer=null,busy=false,won=false,token=0;
try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');state.best=Number.isFinite(s.best)?Math.max(0,Math.floor(s.best)):0}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify({best:state.best}))}catch(e){}}
function runs(line){let a=[],n=0;for(const v of line){if(v)n++;else if(n){a.push(n);n=0}}if(n)a.push(n);return a.length?a:[0]}
function patterns(length,clue){if(clue.length===1&&clue[0]===0)return [0];let a=[];function place(i,at,mask){if(i===clue.length){a.push(mask);return}let min=clue.slice(i+1).reduce((x,y)=>x+y,0)+clue.length-i-1;for(let p=at;p+clue[i]+min<=length;p++)place(i+1,p+clue[i]+1,mask|(((1<<clue[i])-1)<<p))}place(0,0,0);return a}
// Count 0, 1 or at least 2 solutions; hitting the budget means 'unverified'.
function solve(rc,cc,maxNodes=85000){let height=rc.length,width=cc.length,rs=rc.map(x=>patterns(width,x)),cs=cc.map(x=>patterns(height,x)),count=0,nodes=0;function dfs(y,options){if(count>=2||nodes>=maxNodes)return;nodes++;if(y===height){count++;return}for(const row of rs[y]){let filtered=options.map((arr,x)=>arr.filter(mask=>Boolean(mask&(1<<y))===Boolean(row&(1<<x))));if(filtered.some(a=>!a.length))continue;dfs(y+1,filtered);if(count>=2||nodes>=maxNodes)break}}dfs(0,cs);return count===1&&nodes<maxNodes}
function trans(a){return a[0].map((_,x)=>a.map(row=>row[x]))}function blank(height,width){return Array.from({length:height},()=>Array(width).fill(0))}
function sample(height,width,level){let p=level===1?.39:level===2?.44:level===3?.47:.49,a=blank(height,width);if(level===1){let orientation=Math.random()<.5;if(orientation){let y=Math.floor(Math.random()*height);for(let x=0;x<width;x++)if(Math.random()<.78)a[y][x]=1}else{let x=Math.floor(Math.random()*width);for(let y=0;y<height;y++)if(Math.random()<.78)a[y][x]=1}for(let y=0;y<height;y++)for(let x=0;x<width;x++)if(Math.random()<.09)a[y][x]=1;return a}for(let y=0;y<height;y++)for(let x=0;x<width;x++)a[y][x]=Math.random()<p?1:0;return a}
function fallback(height,width){let a=blank(height,width),y=Math.floor(height/2),x=Math.floor(width/2);for(let c=0;c<width;c++)a[y][c]=1;for(let r=0;r<height;r++)a[r][x]=1;return a}
function ms(){return Math.max(0,Math.floor((performance.now()-started)/1000))}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function updateClock(){$('clock').textContent='時間：'+fmt(won?elapsed:ms())}function stopClock(){if(timer)clearInterval(timer);timer=null}
function ui(){let level=state.cleared+1,tier=Math.min(5,Math.ceil(level/3));$('score').textContent='累積分數：'+state.score;$('cleared').textContent='已完成：'+state.cleared+' 題';$('best').textContent='最高累積：'+state.best;$('level').textContent=`第 ${level} 題 · ${['','入門','初級','中級','進階','挑戰'][tier]} · ${h} × ${w}`;$('points').textContent=`本題基礎分：${basePoints()}`;$('progress').textContent=`已標記：${marks.flat().filter(v=>v!==0).length}/${h*w}`}
function basePoints(){let tier=Math.min(5,Math.ceil((state.cleared+1)/3));return Math.round((h*w*(4+tier*2)+tier*30)/5)*5}
function board(){let t=document.createElement('table'),header=document.createElement('tr'),corner=document.createElement('th');corner.className='corner';header.append(corner);for(let x=0;x<w;x++){let th=document.createElement('th');th.className='col'+(x&&x%5===0?' col5':'');th.innerHTML=cols[x].join('<br>');header.append(th)}t.append(header);for(let y=0;y<h;y++){let tr=document.createElement('tr'),th=document.createElement('th');th.className='row'+(y&&y%5===0?' row5':'');th.textContent=rows[y].join('  ');tr.append(th);for(let x=0;x<w;x++){let td=document.createElement('td');td.className='cell'+(x&&x%5===0?' col5':'')+(y&&y%5===0?' row5':'');td.dataset.y=y;td.dataset.x=x;td.setAttribute('aria-label',`第 ${y+1} 行第 ${x+1} 欄`);tr.append(td)}t.append(tr)}$('board').replaceChildren(t)}
async function newPuzzle(){if(busy)return;busy=true;won=false;stopClock();$('next').disabled=true;$('start').disabled=true;$('game').hidden=false;$('win').hidden=true;$('message').textContent='正在產生及驗證唯一解…';let id=++token,found=null,level=state.cleared+1;await new Promise(r=>setTimeout(r,20));for(let i=0;i<130;i++){let a=sample(h,w,level),r=a.map(runs),c=trans(a).map(runs);if(solve(r,c,h*w>=180?38000:85000)){found=a;break}if(i%6===5)await new Promise(r=>setTimeout(r,0));if(id!==token)return}if(!found){let a=fallback(h,w);if(solve(a.map(runs),trans(a).map(runs),150000))found=a}if(!found){$('message').textContent='這次未能驗證題目，請再按「開始新挑戰」。';busy=false;$('start').disabled=false;return}answer=found;rows=answer.map(runs);cols=trans(answer).map(runs);marks=blank(h,w);board();ui();$('message').textContent='新題目開始！';started=performance.now();elapsed=0;updateClock();timer=setInterval(updateClock,250);busy=false;$('next').disabled=false;$('start').disabled=false}
function paint(cell,value){if(!cell||won||busy)return;let y=+cell.dataset.y,x=+cell.dataset.x;if(marks[y][x]===value)return;marks[y][x]=value;cell.classList.toggle('filled',value===1);cell.classList.toggle('marked',value===-1);cell.classList.remove('mistake');cell.textContent=value===-1?'×':'';$('message').textContent='';$('progress').textContent=`已標記：${marks.flat().filter(v=>v!==0).length}/${h*w}`;if(marks.every((row,r)=>row.every((v,c)=>v!==0&&(v===1)===(answer[r][c]===1))))finish()}
function finish(){if(won)return;elapsed=ms();won=true;stopClock();updateClock();let base=basePoints(),bonus=Math.min(base,Math.max(0,Math.floor(base*(1-elapsed/(h*w*8+30))))),earned=base+bonus;state.score+=earned;state.cleared++;state.best=Math.max(state.best,state.score);save();$('score').textContent='累積分數：'+state.score;$('cleared').textContent='已完成：'+state.cleared+' 題';$('best').textContent='最高累積：'+state.best;$('message').textContent='全部格仔正確！';$('result').textContent=`用時 ${fmt(elapsed)} · 基礎分 ${base} + 時間獎勵 ${bonus} = +${earned} 分。現時累積 ${state.score} 分。`;$('win').hidden=false}
$('board').addEventListener('pointerdown',e=>{let cell=e.target.closest('td.cell');if(!cell||won)return;e.preventDefault();drag=e.button===2?-1:mode;paint(cell,
