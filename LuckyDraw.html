<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽獎工具</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --accent: #f59e0b;
    --bg: #f4f5fb;
    --card: #ffffff;
    --border: #e2e4f0;
    --text: #1f2333;
    --muted: #6b7280;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #eef1fb 0%, #fdf2f8 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 4px;
    color: var(--primary-dark);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(79,70,229,0.06);
  }
  .card h2 {
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.6;
    font-family: inherit;
    background: #fbfbff;
  }
  textarea:focus, input:focus { outline: 2px solid var(--primary); }
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .checkbox-row input { width: 16px; height: 16px; }
  .row-btns {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    transition: transform .08s ease, box-shadow .15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    flex: 1;
    box-shadow: 0 4px 10px rgba(79,70,229,0.35);
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled {
    background: #b6b9d6;
    box-shadow: none;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: #eef0fa;
    color: var(--primary-dark);
  }
  .btn-secondary:hover { background: #e0e3fa; }
  .btn-danger {
    background: #fee2e2;
    color: #b91c1c;
  }
  .btn-danger:hover { background: #fecaca; }
  .stage {
    min-height: 130px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 800;
    color: var(--primary-dark);
    background: #fafaff;
    margin-bottom: 18px;
    letter-spacing: 2px;
    padding: 20px;
    text-align: center;
    word-break: break-word;
    position: relative;
    z-index: 1;
  }
  .stage.rolling {
    color: var(--accent);
    animation: pulse 0.15s infinite alternate;
  }
  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
  }
  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: #eef0fa;
    color: var(--primary-dark);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 18px 0 10px;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .round-block {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: #fffdf7;
  }
  .round-block .round-label {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .winner-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .winner-chip {
    background: linear-gradient(135deg, #fde68a, #f59e0b);
    color: #7c2d12;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .winner-chip .num {
    background: #7c2d12;
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remain-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    background: #f7f8fd;
    max-height: 260px;
    overflow-y: auto;
  }
  .remain-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .remain-chip {
    background: #e7e9f7;
    color: var(--primary-dark);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 13px;
  }
  .empty-hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 10px 0;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }

  /* ===== Fireworks overlay ===== */
  #fireworksCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    display: none;
  }
  #fireworksCanvas.active { display: block; }

  .flash-banner {
    position: fixed;
    top: 12%;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    z-index: 10000;
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #7c2d12;
    padding: 16px 36px;
    border-radius: 16px;
    font-size: 26px;
    font-weight: 900;
    box-shadow: 0 10px 30px rgba(245,158,11,0.5);
    opacity: 0;
    pointer-events: none;
    text-align: center;
    max-width: 90vw;
    word-break: break-word;
  }
  .flash-banner.show {
    animation: bannerPop 3s ease forwards;
  }
  @keyframes bannerPop {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.6); }
    12%  { opacity: 1; transform: translateX(-50%) scale(1.08); }
    20%  { opacity: 1; transform: translateX(-50%) scale(1); }
    85%  { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.9); }
  }
</style>
</head>
<body>
<canvas id="fireworksCanvas"></canvas>
<div class="flash-banner" id="flashBanner"></div>

<div class="wrap">
  <h1>🎉 抽獎工具</h1>
  <p class="subtitle">貼上名單、設定每次抽出人數，即可開始抽籤；未抽中嘅人會自動保留到下一輪</p>

  <div class="layout">
    <div class="card">
      <h2>⚙️ 設定</h2>
      <label for="nameInput">參加者名單（每行一個名，或用逗號 / 空格分隔）</label>
      <textarea id="nameInput" placeholder="例如：&#10;陳大文&#10;李小明&#10;王美美&#10;張三&#10;李四"></textarea>

      <label for="drawCount">每次抽出人數</label>
      <input type="number" id="drawCount" min="1" value="1">

      <div class="checkbox-row">
        <input type="checkbox" id="fxToggle" checked>
        <label for="fxToggle" style="margin:0;">開啟全屏煙花特效</label>
      </div>

      <div class="row-btns">
        <button class="btn-primary" id="loadBtn">載入 / 更新名單</button>
      </div>
      <div class="row-btns">
        <button class="btn-secondary" id="exportBtn">匯出結果 (CSV)</button>
        <button class="btn-danger" id="resetBtn">重設全部</button>
      </div>
    </div>

    <div class="card">
      <h2>🎯 抽籤</h2>
      <div class="stats">
        <div class="stat-pill" id="totalStat">總人數：0</div>
        <div class="stat-pill" id="drawnStat">已抽出：0</div>
        <div class="stat-pill" id="remainStat">未抽出：0</div>
        <div class="stat-pill" id="roundStat">已進行輪數：0</div>
      </div>

      <div class="stage" id="stage">請先載入名單</div>

      <div class="row-btns">
        <button class="btn-primary" id="drawBtn" disabled>🎲 開始抽籤</button>
      </div>

      <div class="section-title">🏆 中獎名單（按輪次 / 抽出次序）</div>
      <div id="winnersArea">
        <p class="empty-hint">尚未有抽獎結果</p>
      </div>

      <div class="section-title">📋 未抽名單</div>
      <div class="remain-box">
        <ul class="remain-list" id="remainList"></ul>
      </div>
    </div>
  </div>

  <footer>提示：每次抽籤後，未抽中嘅人會自動留喺「未抽名單」，方便直接進行下一輪抽籤。</footer>
</div>

<script>
let pool = [];        // 未抽出名單
let rounds = [];      // 每輪結果 [{round, names:[...]}]
let totalPeople = 0;

const nameInput = document.getElementById('nameInput');
const drawCountInput = document.getElementById('drawCount');
const loadBtn = document.getElementById('loadBtn');
const drawBtn = document.getElementById('drawBtn');
const resetBtn = document.getElementById('resetBtn');
const exportBtn = document.getElementById('exportBtn');
const stage = document.getElementById('stage');
const remainList = document.getElementById('remainList');
const winnersArea = document.getElementById('winnersArea');
const fxToggle = document.getElementById('fxToggle');
const flashBanner = document.getElementById('flashBanner');

const totalStat = document.getElementById('totalStat');
const drawnStat = document.getElementById('drawnStat');
const remainStat = document.getElementById('remainStat');
const roundStat = document.getElementById('roundStat');

function parseNames(text) {
  return text
    .split(/[\n,，、\t]+/)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

function updateStats() {
  const drawnCount = rounds.reduce((sum, r) => sum + r.names.length, 0);
  totalStat.textContent = `總人數：${totalPeople}`;
  drawnStat.textContent = `已抽出：${drawnCount}`;
  remainStat.textContent = `未抽出：${pool.length}`;
  roundStat.textContent = `已進行輪數：${rounds.length}`;
}

function renderRemain() {
  remainList.innerHTML = '';
  if (pool.length === 0) {
    remainList.innerHTML = '<li class="empty-hint">名單已全部抽完 🎊</li>';
    return;
  }
  pool.forEach(name => {
    const li = document.createElement('li');
    li.className = 'remain-chip';
    li.textContent = name;
    remainList.appendChild(li);
  });
}

function renderWinners() {
  if (rounds.length === 0) {
    winnersArea.innerHTML = '<p class="empty-hint">尚未有抽獎結果</p>';
    return;
  }
  winnersArea.innerHTML = '';
  rounds.forEach((r, idx) => {
    const block = document.createElement('div');
    block.className = 'round-block';
    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = `第 ${idx + 1} 輪（抽出 ${r.names.length} 人）`;
    const ul = document.createElement('ul');
    ul.className = 'winner-list';
    r.names.forEach((name, i) => {
      const li = document.createElement('li');
      li.className = 'winner-chip';
      const numSpan = document.createElement('span');
      numSpan.className = 'num';
      numSpan.textContent = i + 1;
      li.appendChild(numSpan);
      li.appendChild(document.createTextNode(name));
      ul.appendChild(li);
    });
    block.appendChild(label);
    block.appendChild(ul);
    winnersArea.appendChild(block);
  });
}

loadBtn.addEventListener('click', () => {
  const names = parseNames(nameInput.value);
  if (names.length === 0) {
    alert('請輸入至少一個名字！');
    return;
  }
  const uniqueNames = [...new Set(names)];
  if (uniqueNames.length !== names.length) {
    if (!confirm(`偵測到重複名字，已自動移除重複，剩餘 ${uniqueNames.length} 人。是否繼續？`)) {
      return;
    }
  }
  pool = [...uniqueNames];
  totalPeople = uniqueNames.length;
  rounds = [];
  stage.textContent = '準備就緒，按「開始抽籤」！';
  drawBtn.disabled = false;
  updateStats();
  renderRemain();
  renderWinners();
});

drawBtn.addEventListener('click', () => {
  let n = parseInt(drawCountInput.value, 10);
  if (!n || n < 1) n = 1;
  if (pool.length === 0) {
    alert('未抽名單已經冇人喇，請重設或載入新名單。');
    return;
  }
  if (n > pool.length) {
    n = pool.length;
  }

  drawBtn.disabled = true;
  stage.classList.add('rolling');

  let ticks = 0;
  const maxTicks = 18;
  const rollInterval = setInterval(() => {
    const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, n);
    stage.textContent = shuffled.join('、');
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(rollInterval);
      finalizeDraw(n);
    }
  }, 80);
});

function finalizeDraw(n) {
  const shuffledPool = [...pool].sort(() => Math.random() - 0.5);
  const winners = shuffledPool.slice(0, n);
  const winnerSet = new Set(winners);
  pool = pool.filter(name => !winnerSet.has(name));

  rounds.push({ round: rounds.length + 1, names: winners });

  stage.classList.remove('rolling');
  stage.textContent = winners.join('、');

  updateStats();
  renderRemain();
  renderWinners();

  drawBtn.disabled = pool.length === 0;
  if (pool.length === 0) {
    stage.textContent += '（全部人已抽完）';
  }

  if (fxToggle.checked) {
    launchFireworksCelebration(winners);
  }
}

resetBtn.addEventListener('click', () => {
  if (!confirm('確定要重設所有資料（包括名單同抽獎結果）？')) return;
  pool = [];
  rounds = [];
  totalPeople = 0;
  nameInput.value = '';
  drawCountInput.value = 1;
  stage.textContent = '請先載入名單';
  drawBtn.disabled = true;
  updateStats();
  renderRemain();
  renderWinners();
});

exportBtn.addEventListener('click', () => {
  if (rounds.length === 0) {
    alert('尚未有抽獎結果可匯出。');
    return;
  }
  let csv = '輪次,次序,姓名\n';
  rounds.forEach((r, ridx) => {
    r.names.forEach((name, i) => {
      csv += `${ridx + 1},${i + 1},${name}\n`;
    });
  });
  csv += '\n未抽出名單\n';
  pool.forEach(name => { csv += `${name}\n`; });

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '抽獎結果.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

updateStats();
renderRemain();
renderWinners();

/* ===================== 全屏煙花特效 ===================== */
const fwCanvas = document.getElementById('fireworksCanvas');
const fwCtx = fwCanvas.getContext('2d');
let fwParticles = [];
let fwRunning = false;
let fwAnimId = null;
let fwLaunchTimer = null;
let fwStopTimeout = null;

function resizeFwCanvas() {
  fwCanvas.width = window.innerWidth;
  fwCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeFwCanvas);
resizeFwCanvas();

const FW_COLORS = [
  '#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93',
  '#ff924c', '#f72585', '#4cc9f0', '#ffd60a', '#06d6a0'
];

function randRange(min, max) { return Math.random() * (max - min) + min; }

function createExplosion(x, y) {
  const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
  const count = 60 + Math.floor(Math.random() * 40);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
    const speed = randRange(2, 7);
    fwParticles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      color,
      size: randRange(2, 3.5),
      gravity: 0.045,
      decay: randRange(0.008, 0.018)
    });
  }
}

function fwAnimate() {
  fwCtx.fillStyle = 'rgba(10, 10, 25, 0.22)';
  fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

  for (let i = fwParticles.length - 1; i >= 0; i--) {
    const p = fwParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.alpha -= p.decay;

    if (p.alpha <= 0) {
      fwParticles.splice(i, 1);
      continue;
    }

    fwCtx.globalAlpha = Math.max(p.alpha, 0);
    fwCtx.fillStyle = p.color;
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    fwCtx.fill();
  }
  fwCtx.globalAlpha = 1;

  if (fwRunning || fwParticles.length > 0) {
    fwAnimId = requestAnimationFrame(fwAnimate);
  } else {
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    fwCanvas.classList.remove('active');
  }
}

function launchFireworksCelebration(winners) {
  clearTimeout(fwLaunchTimer);
  clearTimeout(fwStopTimeout);
  if (fwAnimId) cancelAnimationFrame(fwAnimId);

  fwParticles = [];
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  fwCanvas.classList.add('active');
  fwRunning = true;
  fwAnimate();

  const burstOnce = () => {
    const x = randRange(fwCanvas.width * 0.12, fwCanvas.width * 0.88);
    const y = randRange(fwCanvas.height * 0.12, fwCanvas.height * 0.55);
    createExplosion(x, y);
  };

  burstOnce();
  let bursts = 0;
  const maxBursts = 14;
  fwLaunchTimer = setInterval(() => {
    burstOnce();
    bursts++;
    if (bursts >= maxBursts) {
      clearInterval(fwLaunchTimer);
      fwRunning = false;
    }
  }, 220);

  const bannerText = winners.length === 1
    ? `🎊 恭喜 ${winners[0]}！🎊`
    : `🎊 恭喜 ${winners.join('、')}！🎊`;
  flashBanner.textContent = bannerText;
  flashBanner.classList.remove('show');
  void flashBanner.offsetWidth;
  flashBanner.classList.add('show');
}
</script>
</body>
</html>
