<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數織闖關｜玩家版</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#fff;--text:#000;--panel:#fff;--border:#000;--cell:38px;--row-gutter:90px;--col-gutter:88px;color-scheme:light}
html[data-theme="dark"]{--bg:#161616;--text:#f5f5f5;--panel:#222;--border:#bbb;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{width:min(100%,1600px);margin:auto;padding:clamp(8px,1.4vw,20px)}h1{margin:0;font-size:clamp(1.4rem,3vw,2rem)}h2{margin:0 0 10px}p{line-height:1.4}.header,.controls,.tools,.metrics{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.header{justify-content:space-between}.controls,.tools,.metrics{margin:9px 0}button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 11px;cursor:pointer}button.main{background:var(--text);color:var(--bg)}button:disabled{opacity:.55;cursor:wait}label{display:grid;gap:4px}.card{border:1px solid var(--border);border-radius:8px;padding:clamp(8px,1vw,14px);margin:10px 0;background:var(--panel)}.metric{border:1px solid var(--border);padding:5px 8px;border-radius:6px}#message{min-height:24px;font-weight:600}.board-area{width:100%;overflow:auto;padding:3px 0}.grid{display:grid;grid-template-columns:var(--row-gutter) repeat(var(--cols),var(--cell));grid-template-rows:var(--col-gutter) repeat(var(--rows),var(--cell));width:max-content;margin:auto;user-select:none}.corner{grid-row:1;grid-column:1}.col-clue,.row-clue{display:flex;color:var(--text);font-size:clamp(11px,1.5vw,17px);font-weight:650;border:0;background:none}.col-clue{flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 4px;line-height:1.03;gap:1px}.col-clue .arrow{margin-top:3px;font-size:1.15em;line-height:1}.row-clue{align-items:center;justify-content:flex-end;gap:3px;padding-right:5px;white-space:nowrap}.row-clue .arrow{font-size:1.12em;line-height:1}.cell{border-right:1px solid #000;border-bottom:1px solid #000;background:#fff;cursor:pointer;touch-action:none}.cell.top-edge{border-top:1px solid #000}.cell.left-edge{border-left:1px solid #000}.cell.c5{border-left:2px solid #000}.cell.r5{border-top:2px solid #000}.cell.filled{background:#777}.cell.mistake{outline:3px solid #d52222;outline-offset:-3px;z-index:1}.cell:focus-visible{outline:3px solid #2765cd;outline-offset:-3px;z-index:2}.hint{font-size:13px;margin:6px 0}.settings{margin-top:16px}.settings .hint{margin:8px 0}#win[hidden],#game[hidden]{display:none}#win{border:2px solid var(--border);border-radius:8px;padding:12px;margin-top:12px}@media(max-width:600px){.col-clue,.row-clue{font-size:11px}.row-clue{gap:1px;padding-right:3px}.col-clue{padding-bottom:2px}.controls{align-items:end}}
</style>
</head>
<body><main>
<div class="header"><h1>數織闖關</h1><button id="theme" type="button">🌙 黑夜模式</button></div>
<section class="card" id="game" hidden>
<div class="metrics"><span class="metric" id="level"></span><span class="metric" id="clock">時間：00:00</span><span class="metric" id="progress"></span><span class="metric" id="points"></span></div>
<div id="message" role="status" aria-live="polite"></div>
<div id="board" class="board-area"></div>
<div class="tools"><button id="check" type="button">檢查</button><button id="reset" type="button">重填本題</button></div>
<p class="hint">點白格塗灰，再點灰格還原白色；可拖曳。毋須填 ×，灰格全對就會自動完成。</p>
<div id="win" hidden><h2>🎉 恭喜，全部答啱！</h2><p id="result"></p><button id="next" class="main" type="button">下一題 →</button></div>
</section>
<section class="card settings"><h2>設定與成績</h2>
<div class="controls"><label for="height">行數（高）<select id="height"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option></select></label>
<label for="width">欄數（闊）<select id="width"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option></select></label>
<button id="start" class="main" type="button">開始新挑戰</button></div>
<div class="metrics"><span class="metric" id="score">累積分數：0</span><span class="metric" id="cleared">已完成：0 題</span><span class="metric" id="best">最高累積：0</span></div>
<p class="hint">行、欄各可選 2–15。按「開始新挑戰」會重設本次分數，歷史最高分保留。</p></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='nonogram-player-v1';
let state={score:0,cleared:0,best:0},h=0,w=0,answer=[],rows=[],cols=[],marks=[],drag=null,started=0,elapsed=0,timer=null,busy=false,won=false;
try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');state.best=Number.isFinite(s.best)?Math.max(0,Math.floor(s.best)):0}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({best:state.best}))}catch(e){}}
function runs(line){let a=[],n=0;for(const v of line){if(v)n++;else if(n){a.push(n);n=0}}if(n)a.push(n);return a.length?a:[0]}
function patterns(length,clue){if(clue.length===1&&clue[0]===0)return[0];let a=[];function place(i,at,mask){if(i===clue.length){a.push(mask);return}let min=clue.slice(i+1).reduce((x,y)=>x+y,0)+clue.length-i-1;for(let p=at;p+clue[i]+min<=length;p++)place(i+1,p+clue[i]+1,mask|(((1<<clue[i])-1)<<p))}place(0,0,0);return a}
function solve(rc,cc,maxNodes=85000){let height=rc.length,width=cc.length,rs=rc.map(x=>patterns(width,x)),cs=cc.map(x=>patterns(height,x)),count=0,nodes=0;function dfs(y,options){if(count>=2||nodes>=maxNodes)return;nodes++;if(y===height){count++;return}for(const row of rs[y]){let filtered=options.map((arr,x)=>arr.filter(mask=>Boolean(mask&(1<<y))===Boolean(row&(1<<x))));if(filtered.some(a=>!a.length))continue;dfs(y+1,filtered);if(count>=2||nodes>=maxNodes)break}}dfs(0,cs);return count===1&&nodes<maxNodes}
function trans(a){return a[0].map((_,x)=>a.map(row=>row[x]))}function blank(height,width){return Array.from({length:height},()=>Array(width).fill(0))}
function sample(height,width,level){let p=level===1?.39:level===2?.44:level===3?.47:.49,a=blank(height,width);if(level===1){if(Math.random()<.5){let y=Math.floor(Math.random()*height);for(let x=0;x<width;x++)if(Math.random()<.78)a[y][x]=1}else{let x=Math.floor(Math.random()*width);for(let y=0;y<height;y++)if(Math.random()<.78)a[y][x]=1}for(let y=0;y<height;y++)for(let x=0;x<width;x++)if(Math.random()<.09)a[y][x]=1;return a}for(let y=0;y<height;y++)for(let x=0;x<width;x++)a[y][x]=Math.random()<p?1:0;return a}
function fallback(height,width){let a=blank(height,width),y=Math.floor(height/2),x=Math.floor(width/2);for(let c=0;c<width;c++)a[y][c]=1;for(let r=0;r<height;r++)a[r][x]=1;return a}
function seconds(){return Math.max(0,Math.floor((performance.now()-started)/1000))}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function updateClock(){$('clock').textContent='時間：'+fmt(won?elapsed:seconds())}function stopClock(){if(timer)clearInterval(timer);timer=null}
function basePoints(){let tier=Math.min(5,Math.ceil((state.cleared+1)/3));return Math.round((h*w*(4+tier*2)+tier*30)/5)*5}
function ui(){let level=state.cleared+1,tier=Math.min(5,Math.ceil(level/3));$('score').textContent='累積分數：'+state.score;$('cleared').textContent='已完成：'+state.cleared+' 題';$('best').textContent='最高累積：'+state.best;$('level').textContent=`第 ${level} 題 · ${['','入門','初級','中級','進階','挑戰'][tier]} · ${h} × ${w}`;$('points').textContent=`本題基礎分：${basePoints()}`;$('progress').textContent=`已塗灰：${marks.flat().filter(Boolean).length}/${h*w}`}
function fit(){if(!w||!h||$('game').hidden)return;let area=$('board'),spaceW=area.clientWidth-6,spaceH=Math.max(220,window.innerHeight-area.getBoundingClientRect().top-165),rowG=Math.min(145,Math.max(44,Math.round(spaceW*.115))),colG=Math.min(150,Math.max(58,Math.round(spaceH*.16)));let cell=Math.floor(Math.min((spaceW-rowG)/w,(spaceH-colG)/h,82));cell=Math.max(18,cell);let grid=area.firstElementChild;if(grid){grid.style.setProperty('--cell',cell+'px');grid.style.setProperty('--row-gutter',rowG+'px');grid.style.setProperty('--col-gutter',colG+'px')}}
function board(){let grid=document.createElement('div');grid.className='grid';grid.style.setProperty('--rows',h);grid.style.setProperty('--cols',w);let corner=document.createElement('div');corner.className='corner';grid.append(corner);for(let x=0;x<w;x++){let d=document.createElement('div');d.className='col-clue';d.style.gridRow='1';d.style.gridColumn=String(x+2);for(const n of cols[x]){let s=document.createElement('span');s.textContent=n;d.append(s)}let arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↓';arrow.setAttribute('aria-hidden','true');d.append(arrow);grid.append(d)}for(let y=0;y<h;y++){let label=document.createElement('div');label.className='row-clue';label.style.gridRow=String(y+2);label.style.gridColumn='1';let nums=document.createElement('span');nums.textContent=rows[y].join('  ');let arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');label.append(nums,arrow);grid.append(label);for(let x=0;x<w;x++){let cell=document.createElement('div');cell.className='cell'+(y===0?' top-edge':'')+(x===0?' left-edge':'')+(x&&x%5===0?' c5':'')+(y&&y%5===0?' r5':'');cell.style.gridRow=String(y+2);cell.style.gridColumn=String(x+2);cell.dataset.y=y;cell.dataset.x=x;cell.setAttribute('role','button');cell.setAttribute('tabindex','0');cell.setAttribute('aria-label',`第 ${y+1} 行第 ${x+1} 欄`);grid.append(cell)}}$('board').replaceChildren(grid);requestAnimationFrame(fit)}
async function newPuzzle(){if(busy)return;busy=true;won=false;stopClock();$('next').disabled=true;$('start').disabled=true;$('game').hidden=false;$('win').hidden=true;$('message').textContent='正在產生及驗證唯一解…';let found=null,level=state.cleared+1;await new Promise(r=>setTimeout(r,20));for(let i=0;i<130;i++){let a=sample(h,w,level),r=a.map(runs),c=trans(a).map(runs);if(solve(r,c,h*w>=180?38000:85000)){found=a;break}if(i%6===5)await new Promise(r=>setTimeout(r,0))}if(!found){let a=fallback(h,w);if(solve(a.map(runs),trans(a).map(runs),150000))found=a}if(!found){$('message').textContent='今次未能驗證題目，請再按「開始新挑戰」。';busy=false;$('start').disabled=false;return}answer=found;rows=answer.map(runs);cols=trans(answer).map(runs);marks=blank(h,w);board();ui();$('message').textContent='新題目開始！';started=performance.now();elapsed=0;updateClock();timer=setInterval(updateClock,250);busy=false;$('next').disabled=false;$('start').disabled=false}
function paint(cell,value){if(!cell||won||busy)return;let y=Number(cell.dataset.y),x=Number(cell.dataset.x);if(marks[y][x]===value)return;marks[y][x]=value;cell.classList.toggle('filled',value===1);cell.classList.remove('mistake');$('message').textContent='';$('progress').textContent=`已塗灰：${marks.flat().filter(Boolean).length}/${h*w}`;if(marks.every((row,r)=>row.every((v,c)=>v===answer[r][c])))finish()}
function finish(){if(won)return;elapsed=seconds();won=true;stopClock();updateClock();let base=basePoints(),bonus=Math.min(base,Math.max(0,Math.floor(base*(1-elapsed/(h*w*8+30))))),earned=base+bonus;state.score+=earned;state.cleared++;state.best=Math.max(state.best,state.score);save();$('score').textContent='累積分數：'+state.score;$('cleared').textContent='已完成：'+state.cleared+' 題';$('best').textContent='最高累積：'+state.best;$('message').textContent='所有灰格及白格都正確！';$('result').textContent=`用時 ${fmt(elapsed)} · 基礎分 ${base} + 時間獎勵 ${bonus} = +${earned} 分。現時累積 ${state.score} 分。`;$('win').hidden=false}
$('board').addEventListener('pointerdown',e=>{let cell=e.target.closest('.cell');if(!cell||won||busy)return;e.preventDefault();let y=Number(cell.dataset.y),x=Number(cell.dataset.x);drag=e.button===2?0:1-marks[y][x];paint(cell,drag)});
$('board').addEventListener('pointerover',e=>{if(drag!==null&&e.buttons)paint(e.target.closest('.cell'),drag)});document.addEventListener('pointerup',()=>drag=null);$('board').addEventListener('contextmenu',e=>e.preventDefault());$('board').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('cell')){e.preventDefault();let cell=e.target;paint(cell,1-marks[Number(cell.dataset.y)][Number(cell.dataset.x)])}});
$('check').onclick=()=>{if(won||busy)return;let wrong=0;for(const cell of $('board').querySelectorAll('.cell')){let y=Number(cell.dataset.y),x=Number(cell.dataset.x),fail=marks[y][x]!==answer[y][x];cell.classList.toggle('mistake',fail);if(fail)wrong++}if(wrong===0)finish();else $('message').textContent=`有 ${wrong} 格與答案不同，已用紅框標示。`};
$('reset').onclick=()=>{if(won||busy)return;marks=blank(h,w);board();ui();$('message').textContent='本題已清空；計時繼續。'};
$('next').onclick=()=>newPuzzle();$('start').onclick=()=>{if(busy)return;h=Number($('height').value);w=Number($('width').value);state.score=0;state.cleared=0;newPuzzle()};window.addEventListener('resize',fit);$('best').textContent='最高累積：'+state.best;
function theme(v){document.documentElement.dataset.theme=v;$('theme').textContent=v==='dark'?'☀️ 日間模式':'🌙 黑夜模式';try{localStorage.setItem('nonogram-player-theme',v)}catch(e){}}$('theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');try{theme(localStorage.getItem('nonogram-player-theme')==='dark'?'dark':'light')}catch(e){theme('light')}
</script></body></html>
